  --blue-50: #EDF1FB; --blue-100: #D4DEF4; --blue-200: #A6BCDA; --blue-300: #6E8BCB;
  --blue-400: #2E4FBF; --blue-500: #1D4590; --blue-600: #183E91; --blue-700: #143476;
  --blue-800: #003F96; --blue-900: #00295E;
  /* ink */
  --ink-900: #181716; --ink-800: #2A2A2A; --ink-700: #44474D; --ink-600: #5E626B;
  --ink-500: #7A7F88; --ink-400: #A1A6AF; --ink-300: #C8CCD3; --ink-200: #E2E5EA;
  --ink-100: #EFF1F4; --ink-50: #F7F8FA;
  /* status (interface only, never official documents) */
  --status-ok: #1DA587; --status-gather: #43B7DE; --status-error: #B32A2D;

  /* semantic aliases */
  --text-strong: var(--ink-900); --text-body: var(--ink-800); --text-muted: var(--ink-600);
  --text-subtle: var(--ink-500); --text-on-brand: var(--fari-white); --text-brand: var(--fari-blue);
  --text-link: var(--fari-web-blue);
  --surface-page: var(--fari-white); --surface-subtle: var(--ink-50);
  --surface-card: var(--fari-white); --surface-sunken: var(--ink-100);
  --border-subtle: var(--ink-200); --border-default: var(--ink-300); --border-strong-ds: var(--ink-400);
  --border-brand: var(--fari-web-blue); --border-focus: var(--fari-web-blue);
  --action-primary: var(--fari-web-blue); --action-primary-hover: var(--fari-blue);
  --action-primary-active: var(--blue-700);
  --action-accent: var(--fari-purple); --action-accent-hover: #6E50B6;
  --action-teal: var(--teal-700); --action-teal-hover: var(--teal-800);
  --focus-ring: color-mix(in srgb, var(--fari-web-blue) 45%, transparent);

  /* type */
  --font-sans: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-demo: "Open Sans", system-ui, -apple-system, sans-serif;
  --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600;
  --weight-bold: 700; --weight-extrabold: 800; --weight-black: 900;
  --text-display: 41.47px; --text-h1: 41.47px; --text-h2: 28.80px; --text-h3: 24.00px;
  --text-lg: 20.00px; --text-base: 16.67px; --text-sm: 13.89px; --text-xs: 11.57px;
  --leading-tight: 1.12; --leading-snug: 1.3; --leading-normal: 1.5; --leading-relaxed: 1.65;
  --tracking-tight: -0.02em; --tracking-snug: -0.01em; --tracking-normal: 0;
  --tracking-wide: 0.04em; --tracking-wider: 0.12em;

  /* space, radii, elevation, motion */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px;
  --radius-xs: 4px; --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;
  --radius-xl: 24px; --radius-pill: 999px; --radius-round: 50%;
  --shadow-xs: 0 1px 2px rgba(24, 62, 145, .06);
  --shadow-sm: 0 1px 3px rgba(24, 62, 145, .08), 0 1px 2px rgba(24, 62, 145, .06);
  --shadow-md: 0 4px 12px rgba(24, 62, 145, .10), 0 2px 4px rgba(24, 62, 145, .06);
  --shadow-lg: 0 12px 28px rgba(24, 62, 145, .12), 0 4px 10px rgba(24, 62, 145, .07);
  --shadow-focus: 0 0 0 3px var(--focus-ring);
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --duration-fast: 120ms; --duration-base: 200ms; --duration-slow: 320ms;
  --container-lg: 1120px;

  /* ==========================================================
     fari-theme.css — the project's layer (SPEC §11)
     Two functional warm colours the cool FARI palette lacks, and
     the seven-tier mapping. Every pair is contrast-verified by
     check-theme.py; re-run it after any change here.
     ========================================================== */
  --fari-amber-700: #8A3D0B; --fari-amber-600: #B85A1B; --fari-amber-100: #F6D9BC; --fari-amber-50: #FBEAD7;
  --fari-gold-700: #6E5806; --fari-gold-600: #8A7017; --fari-gold-100: #F4E7AE; --fari-gold-50: #FBF3D6;

  --tier-grey-fg: var(--ink-800);        --tier-grey-bg: var(--ink-100);       --tier-grey-accent: var(--ink-700);
  --tier-red-fg: #8F2224;                --tier-red-bg: #FBEAEA;               --tier-red-accent: var(--status-error);
  --tier-amber-fg: var(--fari-amber-700); --tier-amber-bg: var(--fari-amber-50); --tier-amber-accent: var(--fari-amber-600);
  --tier-gold-fg: var(--fari-gold-700);  --tier-gold-bg: var(--fari-gold-50);  --tier-gold-accent: var(--fari-gold-600);
  --tier-green-fg: #0A6E62;              --tier-green-bg: var(--teal-50);      --tier-green-accent: var(--teal-800);
  --tier-blue-fg: #1D3F8F;               --tier-blue-bg: var(--blue-50);       --tier-blue-accent: var(--fari-web-blue);
  --tier-purple-fg: #573F94;             --tier-purple-bg: #F0EBFA;            --tier-purple-accent: var(--action-accent-hover);

  /* decision-tree.json uses grey|red|orange|yellow|green|blue|purple.
     orange -> amber, yellow -> gold. */
  --tier-orange-fg: var(--tier-amber-fg); --tier-orange-bg: var(--tier-amber-bg); --tier-orange-accent: var(--tier-amber-accent);
  --tier-yellow-fg: var(--tier-gold-fg);  --tier-yellow-bg: var(--tier-gold-bg);  --tier-yellow-accent: var(--tier-gold-accent);

  /* bridge: the names the rest of this stylesheet already uses */
  --bg: var(--surface-subtle);
  --surface: var(--surface-card);
  --surface-2: var(--surface-sunken);
  --border: var(--border-subtle);
  --border-strong: var(--border-default);
  --text: var(--text-body);
  --accent: var(--action-primary);
  --accent-weak: var(--blue-50);
  --focus: var(--border-focus);
  --radius: var(--radius-lg);
  --shadow: var(--shadow-sm);
  --motion: var(--duration-base);
}
/* FARI ships no dark palette and sets color-scheme: light, so the tool follows the
   brand in one light theme. See SPEC §11; reinstate a dark set only if FARI defines one. */
@media (prefers-reduced-motion: reduce) {
  :root { --motion: 0ms; --duration-fast: 0ms; --duration-base: 0ms; --duration-slow: 0ms; }
  * { animation: none !important; transition: none !important; }
}

* { box-sizing: border-box; }
/* class-based display rules below would otherwise beat the UA [hidden] rule */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 {
  font-family: var(--font-sans); color: var(--text-strong);
  line-height: var(--leading-tight); margin: 0;
  font-weight: var(--weight-bold); letter-spacing: var(--tracking-snug);
  text-wrap: balance;
}
h1 { font-weight: var(--weight-extrabold); letter-spacing: var(--tracking-tight); }
p { margin: 0; text-wrap: pretty; }
a { color: var(--text-link); text-decoration: none; text-underline-offset: 2px; }
a:hover { text-decoration: underline; }
ul, ol { margin: 0; padding-left: 1.25em; }
::selection { background: var(--fari-lighthouse); color: var(--fari-blue); }
:focus-visible {
  outline: 2px solid var(--border-focus); outline-offset: 2px;
  box-shadow: var(--shadow-focus); border-radius: var(--radius-xs);
}
/* long-form reading: FARI keeps Open Sans for exactly this */
.q-explainer, details.disclosure.legal blockquote, .rcard .summary,
.info-panel p, .disclaimer, .review-box p, .rcard .obligations { font-family: var(--font-demo); }

.wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- header ---------- */
header.site {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 0; z-index: 20;
}
header.site .inner {
  display: flex; align-items: center; gap: 14px;
  min-height: 64px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
.brand .t { font-weight: 680; font-size: 1.02rem; }
.brand .s { color: var(--text-muted); font-size: .8rem; }

/* ---------- generic bits ---------- */
/* default size for any inline icon; component rules below override it */
.ico { width: 1.05em; height: 1.05em; vertical-align: -.15em; flex: none; }

/* FARI chip: Montserrat semibold, wide tracking, pill — not monospace */
.chip {
  display: inline-block; font-size: var(--text-xs); font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide);
  padding: 2px 10px; border-radius: var(--radius-pill);
  background: var(--ink-100); border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  /* article refs can be long – must never force a horizontal scrollbar */
  max-width: 100%; overflow-wrap: anywhere;
}
.chip.art { background: var(--blue-50); border-color: transparent; color: var(--tier-blue-fg); }
.chip.role { background: var(--ink-100); border-color: var(--border-subtle); }
.chip.draft { background: var(--fari-amber-50); color: var(--fari-amber-700); border-color: transparent; }
.chip.auto { background: var(--tier-blue-bg); color: var(--tier-blue-fg); border-color: transparent; }

button { font: inherit; color: inherit; cursor: pointer; }
/* FARI buttons: pill, 1.5px keyline, calm hover that lifts 1px, no bounce */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font-sans); font-weight: var(--weight-semibold); font-size: var(--text-base);
  padding: 12px 22px; border-radius: var(--radius-pill);
  border: 1.5px solid var(--border-default); background: var(--surface-card);
  color: var(--text-strong);
  transition: background var(--duration-base) var(--ease-standard),
              border-color var(--duration-base) var(--ease-standard),
              transform var(--duration-fast) var(--ease-standard),
              box-shadow var(--duration-base) var(--ease-standard);
}
.btn:hover { border-color: var(--border-brand); background: var(--blue-50); }
.btn:active { transform: none; }
.btn.primary {
  background: var(--action-primary); border-color: var(--action-primary);
  color: var(--text-on-brand); box-shadow: var(--shadow-xs);
}
.btn.primary:hover {
  background: var(--action-primary-hover); border-color: var(--action-primary-hover);
  transform: translateY(-1px); box-shadow: var(--shadow-sm);
}
.btn.primary:active { background: var(--action-primary-active); transform: none; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
.btn.ghost:hover { background: var(--ink-100); border-color: transparent; color: var(--text-body); }
.btn.small { padding: 7px 14px; font-size: var(--text-sm); }
.btn svg { width: 17px; height: 17px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.card {
  background: var(--surface-card); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
}

details.disclosure { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
details.disclosure > summary {
  cursor: pointer; padding: 10px 14px; font-weight: 550; font-size: .93rem;
  display: flex; align-items: center; gap: 8px; list-style: none;
}
details.disclosure > summary::-webkit-details-marker { display: none; }
details.disclosure > summary::before {
  content: ""; width: 7px; height: 7px; flex: none;
  border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: rotate(-45deg); transition: transform var(--motion); margin-right: 2px;
}
details.disclosure[open] > summary::before { transform: rotate(45deg); }
details.disclosure > .body { padding: 0 14px 14px; font-size: .92rem; }
details.disclosure.legal > .body { font-size: .9rem; }
details.disclosure.legal blockquote {
  margin: 0; padding-left: 12px; border-left: 3px solid var(--border-strong);
  color: var(--text-muted); font-style: italic;
}

.note {
  border-left: 3px solid var(--border-strong); padding: 8px 0 8px 12px;
  color: var(--text-muted); font-size: .9rem;
}
/* info panel used for notes.* (FOSS, provider vs deployer) and cross-link reminders */
.info-panel {
  border: 1px solid var(--border); border-left: 4px solid var(--accent);
  background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: .91rem;
}
.info-panel h4 { font-size: .93rem; margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
.info-panel h4 .ico { color: var(--accent); }
.info-panel .refline { margin-top: 7px; }
.info-panel.reminder {
  border: 1px solid var(--fari-gold-100); border-left: 4px solid var(--tier-gold-accent);
  background: var(--fari-gold-50); color: var(--fari-gold-700);
}
.info-panel.reminder h4 { color: var(--fari-gold-700); }
.info-panel.reminder h4 .ico { color: var(--tier-gold-accent); }

.guidance { display: flex; flex-wrap: wrap; gap: 8px; }
.guidance a {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .85rem; padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); text-decoration: none;
}
.guidance a:hover { border-color: var(--accent); background: var(--accent-weak); }
.guidance a .ico { width: 13px; height: 13px; opacity: .75; }
.guidance .lbl { color: var(--text-muted); font-size: .85rem; align-self: center; }

/* ---------- start screen ---------- */
#start { padding: var(--space-10) 0 var(--space-16); }
#start .lead { max-width: 62ch; }
/* FARI eyebrow: semibold, wide tracking, all caps, web blue */
.eyebrow {
  font-size: var(--text-sm); font-weight: var(--weight-semibold);
  letter-spacing: var(--tracking-wide); text-transform: uppercase;
  color: var(--text-link); margin: 0 0 var(--space-2);
}
#start h1 { font-size: clamp(28.8px, 1.4rem + 2vw, 41.47px); margin-bottom: var(--space-3); }
#start .sub { color: var(--text-muted); font-size: var(--text-lg); margin-bottom: var(--space-6); }

/* mandatory funding attribution */
.funding {
  display: flex; flex-wrap: wrap; gap: var(--space-5); align-items: center;
  margin-top: var(--space-6); padding-top: var(--space-5);
  border-top: 1px solid var(--border-subtle);
}
.funding-logos { display: flex; gap: var(--space-4); align-items: center; }
.funding-logos img { height: 40px; width: auto; }
.funding-text { font-size: var(--text-sm); display: grid; gap: 2px; }
.funding-text strong { color: var(--text-body); }
.tier-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0; }
.tier-legend .item {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--border); border-radius: 999px;
  padding: 5px 12px 5px 9px; font-size: .85rem; background: var(--surface);
}
.tier-legend .item svg { width: 15px; height: 15px; }
.disclaimer {
  border: 1px solid var(--fari-gold-100); border-left: 4px solid var(--tier-gold-accent);
  background: var(--fari-gold-50); color: var(--fari-gold-700);
  border-radius: var(--radius-md); padding: var(--space-4) var(--space-5);
  font-size: var(--text-sm); margin: var(--space-6) 0;
}
.disclaimer strong { display: block; margin-bottom: 4px; color: var(--fari-gold-700); }
.facts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin: 26px 0 30px; }
.facts .f { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
.facts .f b { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 600; }
.facts .f span { font-size: .92rem; }
.start-disclosures { display: grid; gap: 10px; margin-top: 30px; }

/* ---------- assessment layout ---------- */
#app { padding: 22px 0 60px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 26px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* phase stepper — FARI: pill segments with the label underneath */
.stepper { list-style: none; padding: 0; margin: 0 0 var(--space-6); display: flex; gap: var(--space-2); }
.stepper li { flex: 1 1 0; min-width: 0; }
.stepper .seg {
  display: block; font-size: var(--text-xs); color: var(--text-muted);
  transition: color var(--duration-base) var(--ease-standard);
}
.stepper .seg .bar {
  display: block; height: 6px; border-radius: var(--radius-pill);
  background: var(--ink-200); margin-bottom: var(--space-2);
  transition: background var(--duration-base) var(--ease-standard);
}
.stepper .seg .lbl {
  display: flex; align-items: center; gap: 5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.stepper .seg .lbl .ico { width: 12px; height: 12px; }
.stepper li[data-state="current"] .seg { color: var(--text-strong); font-weight: var(--weight-semibold); }
.stepper li[data-state="current"] .seg .bar { background: var(--action-primary); }
.stepper li[data-state="done"] .seg { color: var(--text-body); }
.stepper li[data-state="done"] .seg .bar { background: var(--teal-600); }
.stepper li[data-state="done"] .seg .lbl .ico { color: var(--tier-green-accent); }
.stepper li[data-state="skipped"] .seg { color: var(--text-subtle); }
.stepper li[data-state="skipped"] .seg .bar {
  background: repeating-linear-gradient(45deg, var(--ink-200), var(--ink-200) 4px, var(--ink-100) 4px, var(--ink-100) 8px);
}
.stepper-mobile { display: none; }
@media (max-width: 640px) {
  .stepper .seg .lbl { display: none; }
  .stepper-mobile { display: block; font-size: .85rem; color: var(--text-muted); margin: -12px 0 16px; }
}

/* question screen */
#screen { padding: 26px; }
@media (max-width: 560px) { #screen { padding: 20px 16px; } }
.q-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.q-text { font-size: clamp(1.2rem, 1.05rem + .8vw, 1.5rem); margin-bottom: 12px; }
.q-text:focus { outline: none; }
.q-explainer { color: var(--text-muted); font-size: .95rem; margin-bottom: 18px; max-width: 72ch; }
.panels { display: grid; gap: 10px; margin-bottom: 20px; }
.help-cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.help-cols h4 { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 6px; }
.help-cols ul { padding-left: 1.1em; }
.help-cols li { margin-bottom: 4px; }

fieldset.choices { border: 0; margin: 0 0 20px; padding: 0; }
fieldset.choices > legend { font-weight: 600; font-size: .95rem; padding: 0; margin-bottom: 10px; }
.opt {
  display: flex; gap: 11px; align-items: flex-start;
  border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px;
  background: var(--surface); margin-bottom: 8px;
  transition: border-color var(--motion), background var(--motion);
}
.opt:hover { border-color: var(--border-strong); background: var(--surface-2); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-weak); }
.opt:has(input:disabled) { opacity: 1; background: var(--tier-blue-bg); border-color: transparent; }
.opt > input { margin: 3px 0 0; width: 17px; height: 17px; flex: none; accent-color: var(--accent); }
.opt .txt { font-size: .94rem; min-width: 0; flex: 1 1 auto; }
.opt .plain { font-weight: 550; cursor: pointer; display: block; }
.opt .meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 6px; }
.opt details.exact { margin-top: 7px; }
.opt details.exact > summary {
  cursor: pointer; list-style: none; font-size: .82rem; color: var(--text-muted);
  display: inline-flex; align-items: center; gap: 5px;
}
.opt details.exact > summary::-webkit-details-marker { display: none; }
.opt details.exact > summary::before {
  content: ""; width: 6px; height: 6px; border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform var(--motion);
}
.opt details.exact[open] > summary::before { transform: rotate(45deg); }
.opt details.exact .exact-body { font-size: .87rem; color: var(--text-muted); padding: 7px 0 0 11px; border-left: 2px solid var(--border); margin-top: 6px; display: grid; gap: 6px; }
.opt .obl { color: var(--accent); font-size: .87rem; margin-top: 5px; display: block; }
.opt .example { color: var(--text-muted); font-size: .87rem; margin-top: 4px; display: block; font-style: italic; }

.area { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; background: var(--surface); overflow: hidden; }
.area > summary {
  cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center;
  list-style: none; font-weight: 550; font-size: .95rem;
}
.area > summary::-webkit-details-marker { display: none; }
.area > summary .count {
  margin-left: auto; font-size: .78rem; color: var(--accent);
  background: var(--accent-weak); border-radius: 999px; padding: 2px 9px; font-weight: 600;
}
.area .inner { padding: 0 14px 12px; }
.area .cond { font-size: .84rem; color: var(--text-muted); margin-bottom: 10px; font-style: italic; }
.area.has-sel { border-color: var(--accent); }

.hint {
  display: flex; gap: 9px; align-items: flex-start;
  border: 1px dashed var(--border-strong); border-radius: 9px;
  padding: 11px 14px; margin-bottom: 18px; font-size: .9rem; background: var(--surface-2);
}
.hint .ico { width: 17px; height: 17px; margin-top: 2px; color: var(--accent); }
.hint[hidden] { display: none !important; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .spacer { flex: 1 1 auto; }
.btn-list { display: grid; gap: 10px; margin-bottom: 20px; }
.btn-opt {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  padding: 14px 16px; border-radius: 9px; border: 1px solid var(--border-strong);
  background: var(--surface); font-size: .98rem; font-weight: 550;
  transition: border-color var(--motion), background var(--motion), transform var(--motion);
}
.btn-opt:hover { border-color: var(--accent); background: var(--accent-weak); }
.btn-opt:active { transform: translateY(1px); }
.btn-opt .mark {
  width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center;
  border: 1px solid var(--border-default); font-size: var(--text-xs); color: var(--text-muted); font-weight: var(--weight-semibold);
}
.btn-opt[data-suggested="true"] { border-color: var(--accent); background: var(--accent-weak); }
.btn-opt[data-suggested="true"] .mark { border-color: var(--accent); color: var(--accent); }
.btn-opt[data-tone="unsure"] { border-style: dashed; font-weight: 500; color: var(--text-muted); }
.btn-opt[data-tone="unsure"]:hover { color: var(--text); }

/* context screen */
.ctx-fields { display: grid; gap: 18px; margin-bottom: 20px; }
.ctx-field label.lbl { display: block; font-weight: 600; font-size: .95rem; margin-bottom: 6px; }
.ctx-field select {
  font: inherit; color: inherit; width: 100%; max-width: 480px;
  padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-strong);
  background: var(--surface);
}
.ctx-field .refline { margin-top: 7px; }

/* verdict-so-far panel */
aside.verdict { position: sticky; top: 88px; }
@media (max-width: 900px) { aside.verdict { position: static; } }
.verdict .card { padding: 16px; }
.verdict h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 12px; }
.vlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
.vlist li { display: flex; gap: 9px; align-items: flex-start; font-size: .89rem; }
.vlist li.new { animation: highlight 1.1s ease-out; }
@keyframes highlight { from { background: var(--accent-weak); } to { background: transparent; } }
.vlist .mk {
  width: 20px; height: 20px; border-radius: 5px; flex: none; display: grid; place-items: center;
  background: var(--surface-2); color: var(--text-muted);
}
.vlist .mk svg { width: 13px; height: 13px; }
.vlist li[data-color] .mk { background: var(--tone-bg); color: var(--tone); }
.vlist .sub { color: var(--text-muted); font-size: .82rem; }
.vlist li.pending .mk { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
.verdict .empty { color: var(--text-muted); font-size: .88rem; }

/* ---------- result ---------- */
#result { padding: 26px 0 70px; }
#result > .wrap > header { margin-bottom: 22px; }
#result h1 { font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.05rem); margin-bottom: 8px; }
#result .subtitle { color: var(--text-muted); }
.result-cards { display: grid; gap: 16px; margin-bottom: 26px; }
/* FARI result card: tinted header band with a 6px keyline, white body */
.rcard {
  border-radius: var(--radius-lg); border: 1px solid var(--border-subtle);
  background: var(--surface-card); box-shadow: var(--shadow-md); overflow: hidden;
}
.rcard .top {
  display: flex; gap: var(--space-3); align-items: flex-start;
  padding: var(--space-5) var(--space-6);
  border-left: 6px solid var(--tone); background: var(--tone-bg); color: var(--tone-fg);
}
.rcard .badge { flex: none; color: var(--tone); display: grid; place-items: center; }
.rcard .badge svg { width: 24px; height: 24px; }
.rcard .kicker {
  font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wide);
  font-weight: var(--weight-semibold); color: var(--tone-fg); opacity: .85;
}
.rcard h2 { font-size: var(--text-lg); font-weight: var(--weight-extrabold); margin: 2px 0 0; color: var(--tone-fg); }
.rcard .body { padding: var(--space-5) var(--space-6); display: grid; gap: var(--space-4); }
.rcard .summary { font-size: .96rem; }
.rcard h3.lbl { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 6px; }
.rcard ul.obligations { padding-left: 1.15em; display: grid; gap: 5px; font-size: .93rem; }
.rcard .role-group { margin-bottom: 12px; }
.rcard .role-group:last-child { margin-bottom: 0; }
.rcard .role-group > h4 {
  font-size: .86rem; margin-bottom: 5px; display: flex; align-items: center; gap: 7px;
}
.rcard .role-group > h4 .ico { width: 14px; height: 14px; color: var(--text-muted); }
.rcard .role-note { font-size: .86rem; color: var(--text-muted); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rcard .triggered { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface-2); }
.rcard .triggered ul { padding-left: 1.15em; display: grid; gap: 8px; font-size: .9rem; margin-top: 6px; }
.rcard .dates { display: flex; gap: 9px; align-items: flex-start; font-size: .88rem; color: var(--text-muted); }
.rcard .dates svg { width: 16px; height: 16px; margin-top: 3px; }
.rcard .refs { display: flex; flex-wrap: wrap; gap: 6px; }

.review-box { border: 1px solid var(--fari-gold-100); background: var(--fari-gold-50); color: var(--fari-gold-700); border-radius: var(--radius-md); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-6); }
.review-box h2 { font-size: 1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.review-box h2 svg { width: 18px; height: 18px; color: var(--tier-gold-accent); }
.review-box ol { display: grid; gap: 10px; font-size: .92rem; }
.review-box .q { font-weight: 600; }

.section { margin-bottom: 26px; }
.section > h2 { font-size: 1.05rem; margin-bottom: 12px; }

/* answer timeline */
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 14px; }
.timeline .rail { display: flex; flex-direction: column; align-items: center; }
.timeline .rail .dot {
  width: 12px; height: 12px; border-radius: 50%; background: var(--surface);
  border: 2px solid var(--accent); margin-top: 5px; flex: none;
}
.timeline .rail .line { flex: 1 1 auto; width: 2px; background: var(--border); margin: 4px 0; min-height: 8px; }
.timeline li:last-child .rail .line { display: none; }
.timeline .content { padding-bottom: 18px; min-width: 0; }
.timeline .q { font-size: .93rem; font-weight: 550; }
.timeline .a { font-size: .93rem; margin-top: 3px; display: flex; gap: 7px; align-items: baseline; }
.timeline .a .arrow { color: var(--text-muted); flex: none; }
.timeline .meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 6px; }
.timeline ul.sel { padding-left: 1.1em; margin-top: 6px; font-size: .87rem; color: var(--text-muted); display: grid; gap: 3px; }
.timeline .uncertain-tag { color: var(--fari-gold-700); font-weight: var(--weight-semibold); font-size: var(--text-xs); }

/* decision map */
/* the map is wider than a phone: it scrolls inside its own box and must never widen
   the page. min-width:0 is what lets it shrink inside the grid on the start screen. */
.map-wrap { overflow-x: auto; max-width: 100%; min-width: 0; }
.start-disclosures > details, details.disclosure > .body { min-width: 0; }
.map { min-width: 640px; }
.map text { font: 11px system-ui, sans-serif; fill: var(--text-muted); }
.map .box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
.map .box.on { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-weak); }
.map .lbl { fill: var(--text); font-weight: 550; }
.map .edge { stroke: var(--border); stroke-width: 1.5; fill: none; }
.map .edge.on { stroke: var(--accent); stroke-width: 2.5; }

.link-list { list-style: none; padding: 0; margin-top: 8px; display: grid; gap: 7px; font-size: .93rem; }
.link-list a { display: inline-flex; align-items: center; gap: 6px; }
.link-list .ico { width: 14px; height: 14px; opacity: .7; }

/* ---------- footer ---------- */
footer.site { border-top: 1px solid var(--border); background: var(--surface); padding: 26px 0 40px; font-size: .87rem; color: var(--text-muted); }
footer.site .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
footer.site h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; color: var(--text); }
footer.site ul { list-style: none; padding: 0; display: grid; gap: 5px; }
footer.site .meta-line { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px 16px; }

#databanner { display: none; margin: 16px 0; border: 1px solid var(--tier-red-accent); background: var(--tier-red-bg); color: var(--tier-red-fg); border-radius: var(--radius-md); padding: 12px 14px; font-size: var(--text-sm); }
#databanner ul { margin-top: 6px; }

/* ---------- print / PDF ---------- */
@media print {
  :root {
    /* FARI semantic names first, since the components read those directly */
    --surface-page: #fff; --surface-card: #fff; --surface-subtle: #fff; --surface-sunken: #fff;
    --text-strong: #000; --text-body: #000; --text-muted: #333; --text-subtle: #444;
    --text-link: #000; --text-on-brand: #fff;
    --border-subtle: #b0b0b0; --border-default: #808080; --border-brand: #000;
    --action-primary: #000; --action-primary-hover: #000; --blue-50: #fff; --teal-50: #fff; --teal-100: #999;
    --shadow-xs: none; --shadow-sm: none; --shadow-md: none; --shadow-lg: none; --shadow-focus: none;
    --bg: #fff; --surface: #fff; --surface-2: #fff; --border: #b0b0b0; --border-strong: #808080;
    --text: #000; --text-muted: #333; --accent: #000; --accent-weak: #fff; --shadow: none;
    --tier-grey-accent: #444; --tier-red-accent: #000; --tier-amber-accent: #000; --tier-gold-accent: #000;
    --tier-green-accent: #000; --tier-blue-accent: #000; --tier-purple-accent: #000;
    --tier-orange-accent: #000; --tier-yellow-accent: #000;
    --tier-grey-fg: #000; --tier-red-fg: #000; --tier-amber-fg: #000; --tier-gold-fg: #000;
    --tier-green-fg: #000; --tier-blue-fg: #000; --tier-purple-fg: #000;
    --tier-orange-fg: #000; --tier-yellow-fg: #000;
    --tier-grey-bg: #fff; --tier-red-bg: #fff; --tier-amber-bg: #fff; --tier-gold-bg: #fff;
    --tier-green-bg: #fff; --tier-blue-bg: #fff; --tier-purple-bg: #fff;
    --tier-orange-bg: #fff; --tier-yellow-bg: #fff;
    --fari-gold-50: #fff; --fari-gold-100: #999; --fari-gold-700: #000;
    --fari-amber-50: #fff; --fari-amber-700: #000; --ink-100: #fff; --ink-200: #ccc;
  }
  header.site, aside.verdict, .no-print, .stepper, #databanner { display: none !important; }
  footer.site .grid { display: none; }        /* links/sources are noise on paper */
  footer.site .funding { border-top: 1px solid #999; }   /* the ERDF line must print */
  body { background: #fff; font-size: 11.5pt; }
  .wrap { max-width: none; padding: 0; }
  #result { padding: 0; }
  .card, .rcard, .review-box, .info-panel { box-shadow: none; break-inside: avoid; }
  .rcard { border: 1px solid #999; border-left: 4px solid #000; }
  details.disclosure > .body, .area .inner { display: block !important; }
  details.disclosure > summary::before { display: none; }
  a { color: #000; text-decoration: underline; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 8.5pt; color: #555; word-break: break-all; }
  .section, .rcard { page-break-inside: avoid; }
}

    "S1_prohibited": {
      "module": "SPINE",
      "type": "question",
      "text": "Does your system do any of the things the AI Act bans outright?",
      "explainer": "A small number of AI uses are banned in the EU because they're considered too harmful. Have a quick look through the list. If your system does any of them, it's banned, whatever else is true. Two to watch: reading people's emotions at work or school, and sorting people by sensitive traits (like race or beliefs), are usually banned rather than just 'high-risk'.",
      "legalText": {
        "articleRef": "Art. 5",
        "text": "Article 5 prohibits, among others: manipulative or deceptive techniques and exploitation of vulnerabilities that cause significant harm; social scoring; predicting crime based solely on profiling; untargeted scraping of facial images; emotion recognition in the workplace and education; biometric categorisation inferring sensitive attributes; and real-time remote biometric identification in public spaces for law enforcement (with narrow exceptions)."
      },
      "articleRef": "Art. 5",
      "guidelineLinks": ["prohibited_practices"],
      "checklist": "prohibitedPractices",
      "options": [
        { "label": "Yes, at least one of these applies", "value": "yes", "next": "PROHIBITED" },
        { "label": "No, none of these apply", "value": "no", "next": "S2_annex_i_product" }
      ]
    },

    "S2_annex_i_product": {
      "module": "SPINE",
      "type": "question",
      "text": "Is your system part of a physical product that already has EU safety rules?",
      "explainer": "Some products, like machines, medical devices, toys, cars or lifts, must already meet EU safety law before they can be sold. This route applies if your AI is one of those products, or is a part that keeps it safe (a 'safety component', meaning something whose failure could hurt people, or that does a safety job). Features that only improve comfort, efficiency or convenience usually don't count.",
      "legalText": {
        "articleRef": "Art. 6(1); Art. 3(14); Annex I",
        "text": "An AI system is high-risk under Article 6(1) where it is itself a product, or is intended to be used as a safety component of a product, covered by the Union harmonisation legislation listed in Annex I. 'Safety component' (Art. 3(14)) means a component which fulfils a safety function for that product, or the failure or malfunctioning of which endangers the health and safety of persons or property."
      },
      "help": {
        "likelyYes": [
          "Your AI is, or sits inside, a regulated product (medical device, machine, vehicle, lift, toy, radio equipment)",
          "It does a safety job (spots a person and triggers a safe stop; prevents a collision)",
          "If it failed, someone could get hurt (lane-keeping, lift-door control)"
        ],
        "likelyNo": [
          "It only improves comfort, efficiency or convenience, and a failure would just be annoying or costly",
          "The product isn't covered by any EU product-safety law"
        ]
      },
      "articleRef": "Art. 6(1); Annex I",
      "guidelineLinks": ["high_risk_classification"],
      "reference": "annexI_legislation",
      "options": [
        { "label": "Yes, it's a regulated product or a safety part of one", "value": "yes", "next": "S3_annex_i_tpca" },
        { "label": "No", "value": "no", "next": "S4_annex_iii_area" },
        { "label": "I'm not sure", "value": "unsure", "next": "S3_annex_i_tpca", "flagsReview": true, "reviewNote": "Whether your AI is a regulated product or a safety component can be technical. We've kept you on the product-safety route so you also see the next question; confirm with the relevant product legislation or an expert." }
      ]
    },

    "S3_annex_i_tpca": {
      "module": "SPINE",
      "type": "question",
      "text": "Does that product need to be checked by an independent body before it's sold?",
      "explainer": "For your AI to be high-risk on this route, an outside body (a 'notified body') has to be involved in approving the product, not just your own company. If you're allowed to sign it off yourself, this route does not make it high-risk.",
      "legalText": {
        "articleRef": "Art. 6(1)(b)",
        "text": "The second cumulative condition of Article 6(1): the product whose safety component is the AI system, or the AI system itself as a product, is required to undergo a third-party conformity assessment with a view to the placing on the market or putting into service of that product pursuant to the Annex I legislation."
      },
      "help": {
        "likelyYes": ["The product law requires a notified body (e.g. many medical devices, higher-risk machinery)"],
        "likelyNo": ["You can self-certify with internal checks only"]
      },
      "articleRef": "Art. 6(1)(b)",
      "guidelineLinks": ["high_risk_classification"],
      "options": [
        { "label": "Yes, an independent body must check it", "value": "yes", "next": "HIGH_RISK_ANNEX_I" },
        { "label": "No, we're allowed to self-certify", "value": "no", "next": "S4_annex_iii_area" },
        { "label": "I'm not sure", "value": "unsure", "next": "S4_annex_iii_area", "flagsReview": true, "reviewNote": "If an independent ('notified') body must approve the product, your AI is high-risk on the product-safety route. Check the specific product legislation to be sure." }
      ]
    },

    "S4_annex_iii_area": {
      "module": "SPINE",
      "type": "question",
      "text": "Is your system used for one of the sensitive purposes on the AI Act's high-risk list?",
      "explainer": "The AI Act singles out certain uses, across eight areas, as high-risk because they can seriously affect people's lives. The areas cover things like hiring and managing staff, credit and insurance, education, essential services, law enforcement, migration, and justice and elections. Only the specific uses listed under each area count, not the whole area. Tick anything that matches what your system is actually meant to do. Many only apply when the system assesses people, not just companies.",
      "legalText": {
        "articleRef": "Art. 6(2); Annex III",
        "text": "AI systems referred to in Annex III shall be considered high-risk. Annex III lists eight areas (biometrics; critical infrastructure; education and vocational training; employment and workers' management; access to essential private and public services; law enforcement; migration, asylum and border control; administration of justice and democratic processes) and, under each, an exhaustive list of specific use cases."
      },
      "articleRef": "Art. 6(2); Annex III",
      "guidelineLinks": ["high_risk_classification", "annex_iii_reference"],
      "reference": "annexIII",
      "options": [
        { "label": "Yes, it matches at least one listed use", "value": "yes", "next": "S5_profiling" },
        { "label": "No, none of these match", "value": "no", "next": "T0_transparency" },
        { "label": "I'm not sure", "value": "unsure", "next": "S5_profiling", "flagsReview": true, "reviewNote": "If you're unsure whether your use is on the high-risk list, we've treated it as possibly high-risk so you see the rest of the checks. Compare your exact purpose against the Annex III list or ask an expert." }
      ]
    },

    "S5_profiling": {
      "module": "SPINE",
      "type": "question",
      "text": "Does your system build a profile of individual people?",
      "explainer": "'Profiling' means automatically analysing someone's personal data to evaluate or predict things about them, for example their performance at work, health, finances, interests, reliability, behaviour, or where they are and where they go. If your system does this, the AI Act always treats it as high-risk, and the exemptions on the next screen can't be used.",
      "legalText": {
        "articleRef": "Art. 6(3), third sub-paragraph; Art. 4(4) GDPR",
        "text": "An AI system referred to in Annex III shall always be considered high-risk where it performs profiling of natural persons. 'Profiling' (Art. 4(4) GDPR) means any form of automated processing of personal data to evaluate certain personal aspects relating to a natural person, in particular to analyse or predict aspects concerning performance at work, economic situation, health, personal preferences, interests, reliability, behaviour, location or movements."
      },
      "articleRef": "Art. 6(3); Art. 4(4) GDPR",
      "guidelineLinks": ["high_risk_classification"],
      "options": [
        { "label": "Yes, it profiles people", "value": "yes", "next": "HIGH_RISK_ANNEX_III" },
        { "label": "No", "value": "no", "next": "S6_filter" },
        { "label": "I'm not sure", "value": "unsure", "next": "S6_filter", "flagsReview": true, "reviewNote": "If it turns out your system profiles people, it is automatically high-risk and the exemptions don't apply. We've let you check the exemptions, but confirm the profiling question carefully." }
      ]
    },

    "S6_filter": {
      "module": "SPINE",
      "type": "question",
      "text": "Could your system be exempt because it only plays a limited, supporting role?",
      "explainer": "Even if your use is on the high-risk list, it might not count as high-risk if it only does a narrow, supporting job and doesn't really affect the final decision. You qualify only if at least one of the situations on this screen fits your system AND it doesn't meaningfully sway the outcome. These are read strictly. This escape hatch does not apply if your system profiles people, or if it's part of a bigger setup that together does affect decisions.",
      "legalText": {
        "articleRef": "Art. 6(3)(a)-(d); Recital 53",
        "text": "By way of derogation, an Annex III system is not high-risk where it does not pose a significant risk of harm, including by not materially influencing the outcome of decision making, because it: (a) performs a narrow procedural task; (b) improves the result of a previously completed human activity; (c) detects decision-making patterns or deviations and is not meant to replace or influence the previously completed human assessment without proper human review; or (d) performs a preparatory task to a relevant assessment."
      },
      "articleRef": "Art. 6(3)(a)-(d)",
      "guidelineLinks": ["high_risk_classification"],
      "checklist": "filterConditions",
      "options": [

        { "label": "No, none really fits (or it does affect the outcome)", "value": "no", "next": "HIGH_RISK_ANNEX_III" },
        { "label": "I'm not sure", "value": "unsure", "next": "HIGH_RISK_ANNEX_III", "flagsReview": true, "reviewNote": "You can only rely on this exemption if you can clearly show and document that one of the conditions fits. If you're not sure, it's safer to treat the system as high-risk for now." }
      ]
    },

    "T0_transparency": {
      "module": "TRANSPARENCY",
      "type": "question",
      "text": "Does your system need to be open with people in any of these ways?",
      "explainer": "Some AI systems have to be upfront about what they are, whatever their risk level. These duties stack on top of your category. Tick anything that applies. Anything we already worked out from your earlier answers is ticked for you and locked. If none applies and your system isn't high-risk, it's minimal-risk.",
      "legalText": {
        "articleRef": "Art. 50",

    "G0_gpai": {
      "module": "GPAI",
      "type": "question",
      "text": "Did you build a general-purpose ('foundation') AI model?",
      "explainer": "This is a separate question about the model itself, not how it's used. A general-purpose model is a large model, trained on huge amounts of data, that can handle many different tasks, like a large language model or a big image generator. If you only use or fine-tune someone else's model to build your app, these duties usually sit with the maker of the original model, unless you change it substantially.",
      "legalText": {
        "articleRef": "Art. 3(63); Art. 53",
        "text": "'General-purpose AI model' means an AI model, including where trained with a large amount of data using self-supervision at scale, that displays significant generality and is capable of competently performing a wide range of distinct tasks regardless of the way the model is placed on the market, and that can be integrated into a variety of downstream systems or applications."
      },
      "help": {
        "likelyYes": [
          "You trained a large model that works across many tasks (a language model, a big image/audio/video model)",
          "You put a foundation model out there for others to build on"
        ],
        "likelyNo": [
          "Your model does one specific job only",
          "You just call or fine-tune someone else's model without changing it much"
        ]
      },
      "articleRef": "Art. 3(63); Art. 53",
      "guidelineLinks": ["gpai_scope", "gpai_code_of_practice"],
      "options": [
        { "label": "Yes, I provide a general-purpose model", "value": "yes", "next": "G1_systemic" },
        { "label": "No, it's a specific-purpose system, or I use someone else's model", "value": "no", "next": "RESULT" },
        { "label": "I'm not sure", "value": "unsure", "next": "RESULT", "flagsReview": true, "reviewNote": "You might be a general-purpose AI model provider, which carries its own duties. Check the 'duties for GPAI model providers' guidance to be sure." }
      ]
    },

    "G1_systemic": {
      "module": "GPAI",
      "type": "question",
      "text": "Is your model one of the most powerful, 'systemic-risk' models?",
      "explainer": "The most capable general-purpose models carry extra duties. Yours is presumed to be in this group if training it used more than 10^25 FLOP of computing power (a very high bar that only the largest models reach today), or if the Commission has formally designated it. Most models are not in this group.",
      "legalText": {
        "articleRef": "Art. 51; Art. 55",
        "text": "A general-purpose AI model has systemic risk if it has high-impact capabilities (presumed where the cumulative amount of computation used for its training exceeds 10^25 floating point operations) or is designated as such by the Commission. Such models are subject to the additional obligations in Article 55."
      },
      "help": {
        "likelyYes": ["Training used more than 10^25 FLOP", "The Commission has designated your model"],
        "likelyNo": ["Training was well below that bar and there's no designation"]
      },
      "articleRef": "Art. 51; Art. 55",
      "guidelineLinks": ["gpai_scope", "gpai_code_of_practice"],
      "options": [
        { "label": "Yes (over the 10^25 FLOP bar, or designated)", "value": "yes", "next": "RESULT", "setsGpai": "gpai_model_systemic" },
        { "label": "No / it's a smaller model", "value": "no", "next": "RESULT", "setsGpai": "gpai_model" },
        { "label": "I'm not sure", "value": "unsure", "next": "RESULT", "setsGpai": "gpai_model", "flagsReview": true, "reviewNote": "The systemic-risk bar is very high, so most models are below it. If your training compute was anywhere near 10^25 FLOP, check the GPAI guidance, as the extra duties are significant." }
      ]
    },
