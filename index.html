<title>EU AI Act – Risk Tier Self-Assessment</title>

<!--
  EU AI Act – Risk Tier Self-Assessment
  =====================================
  Single self-contained page. No build step, no back-end, no storage, no tracking.

  ALL content and ALL classification logic live in decision-tree.json.
  This file only renders whatever that file describes.

  Data loading order:
    1. try fetch("decision-tree.json")  -> used when hosted next to the JSON file
    2. fall back to the embedded copy in <script id="decision-tree-data"> below
       (needed when the page is opened directly from disk via file://)

  After editing decision-tree.json, refresh the embedded copy with:
      node sync-embedded-json.mjs
-->

<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --border: #dce0e6;
  --border-strong: #b9c0ca;
  --text: #14181f;
  --text-muted: #5b6472;
  --accent: #1d4ed8;
  --accent-weak: #e8eeff;
  --focus: #1d4ed8;

  /* semantic tier palette – outcomes[].color maps onto these */
  --c-grey: #4b5563;
  --c-grey-bg: #eef0f3;
  --c-red: #c81e1e;
  --c-red-bg: #fdeceb;
  --c-orange: #b3450b;
  --c-orange-bg: #fdefe4;
  --c-yellow: #8a6100;
  --c-yellow-bg: #fdf3d7;
  --c-green: #11703a;
  --c-green-bg: #e6f5ea;
  --c-blue: #1d4ed8;
  --c-blue-bg: #e8eeff;
  --c-purple: #6528c4;
  --c-purple-bg: #f1e9fe;

  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px -16px rgba(16, 24, 40, .3);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --motion: 200ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10141a;
    --surface: #171c24;
    --surface-2: #1e242e;
    --border: #2c3440;
    --border-strong: #46505f;
    --text: #e8ecf2;
    --text-muted: #9aa5b4;
    --accent: #7ea2ff;
    --accent-weak: #1c2740;
    --focus: #7ea2ff;
    --c-grey: #a8b1bd; --c-grey-bg: #232932;
    --c-red: #ff8a80; --c-red-bg: #3a1e1e;
    --c-orange: #ffab6b; --c-orange-bg: #3a2716;
    --c-yellow: #f0c650; --c-yellow-bg: #33290d;
    --c-green: #6ede97; --c-green-bg: #14301f;
    --c-blue: #9db8ff; --c-blue-bg: #1b2540;
    --c-purple: #c4a3ff; --c-purple-bg: #271a3e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
@media (prefers-reduced-motion: reduce) {
  :root { --motion: 0ms; }
  * { animation: none !important; transition: none !important; }
}

* { box-sizing: border-box; }
/* class-based display rules below would otherwise beat the UA [hidden] rule */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
h1, h2, h3, h4 { line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
ul, ol { margin: 0; padding-left: 1.25em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

.wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- header ---------- */
header.site {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 0; z-index: 20;
}
header.site .inner {
  display: flex; align-items: center; gap: 14px;
  min-height: 64px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { width: 26px; height: 26px; color: var(--accent); flex: none; }
.brand .t { font-weight: 680; font-size: 1.02rem; }
.brand .s { color: var(--text-muted); font-size: .8rem; }

/* ---------- generic bits ---------- */
.chip {
  display: inline-block; font-family: var(--mono); font-size: .74rem;
  padding: 2px 7px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-muted);
  /* article refs can be long ("Art. 3(1); Guidelines on…") – must never force a
     horizontal scrollbar on narrow screens */
  max-width: 100%; overflow-wrap: anywhere;
}
.chip.art { background: var(--accent-weak); border-color: transparent; color: var(--accent); }

button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border-strong);
  background: var(--surface); font-weight: 550;
  transition: background var(--motion), border-color var(--motion), transform var(--motion);
}
.btn:hover { border-color: var(--accent); background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #0d1017; } }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--border); }
.btn.small { padding: 6px 11px; font-size: .85rem; }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}

details.disclosure { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
details.disclosure > summary {
  cursor: pointer; padding: 10px 14px; font-weight: 550; font-size: .93rem;
  display: flex; align-items: center; gap: 8px; list-style: none;
}
details.disclosure > summary::-webkit-details-marker { display: none; }
details.disclosure > summary::before {
  content: ""; width: 7px; height: 7px; flex: none;
  border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: rotate(-45deg); transition: transform var(--motion); margin-right: 2px;
}
details.disclosure[open] > summary::before { transform: rotate(45deg); }
details.disclosure > .body { padding: 0 14px 14px; font-size: .92rem; }

.note {
  border-left: 3px solid var(--border-strong); padding: 8px 0 8px 12px;
  color: var(--text-muted); font-size: .9rem;
}

/* ---------- start screen ---------- */
#start { padding: 40px 0 64px; }
#start .lead { max-width: 62ch; }
#start h1 { font-size: clamp(1.6rem, 1.1rem + 2vw, 2.3rem); margin-bottom: 12px; }
#start .sub { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 26px; }
.tier-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0; }
.tier-legend .item {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--border); border-radius: 999px;
  padding: 5px 12px 5px 9px; font-size: .85rem; background: var(--surface);
}
.tier-legend .item svg { width: 15px; height: 15px; }
.disclaimer {
  border: 1px solid var(--border); border-left: 4px solid var(--c-yellow);
  background: var(--c-yellow-bg); color: var(--text);
  border-radius: 8px; padding: 14px 16px; font-size: .9rem; margin: 26px 0;
}
.disclaimer strong { display: block; margin-bottom: 4px; }
.facts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin: 26px 0 30px; }
.facts .f { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
.facts .f b { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 600; }
.facts .f span { font-size: .92rem; }

/* ---------- assessment layout ---------- */
#app { padding: 22px 0 60px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 26px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* phase stepper */
.stepper { list-style: none; padding: 0; margin: 0 0 20px; display: flex; gap: 8px; }
.stepper li { flex: 1 1 0; min-width: 0; }
.stepper .seg {
  display: flex; align-items: center; gap: 7px;
  border-top: 4px solid var(--border); padding-top: 8px;
  font-size: .82rem; color: var(--text-muted);
  transition: border-color var(--motion), color var(--motion);
}
.stepper .seg .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stepper .seg .dot {
  width: 16px; height: 16px; border-radius: 50%; flex: none;
  border: 2px solid var(--border-strong); display: grid; place-items: center;
  font-size: 10px; line-height: 1;
}
.stepper .seg .dot svg { width: 10px; height: 10px; }
.stepper li[data-state="current"] .seg { border-top-color: var(--accent); color: var(--text); font-weight: 600; }
.stepper li[data-state="current"] .seg .dot { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); animation: pulse 2s ease-in-out infinite; }
.stepper li[data-state="done"] .seg { border-top-color: var(--c-green); color: var(--text); }
.stepper li[data-state="done"] .seg .dot { border-color: var(--c-green); background: var(--c-green-bg); color: var(--c-green); }
.stepper li[data-state="skipped"] .seg { opacity: .55; border-top-style: dotted; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px var(--accent-weak); } }
.stepper-mobile { display: none; }
@media (max-width: 640px) {
  .stepper .seg .lbl { display: none; }
  .stepper-mobile { display: block; font-size: .85rem; color: var(--text-muted); margin: -12px 0 16px; }
}

/* question screen */
#screen { padding: 26px; }
@media (max-width: 560px) { #screen { padding: 20px 16px; } }
.q-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.q-text { font-size: clamp(1.2rem, 1.05rem + .8vw, 1.5rem); margin-bottom: 12px; }
.q-text:focus { outline: none; }
.q-explainer { color: var(--text-muted); font-size: .95rem; margin-bottom: 18px; max-width: 72ch; }
.panels { display: grid; gap: 10px; margin-bottom: 20px; }
.help-cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.help-cols h4 { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 6px; }
.help-cols ul { padding-left: 1.1em; }
.help-cols li { margin-bottom: 4px; }

fieldset.choices { border: 0; margin: 0 0 20px; padding: 0; }
fieldset.choices > legend { font-weight: 600; font-size: .95rem; padding: 0; margin-bottom: 10px; }
.opt {
  display: flex; gap: 11px; align-items: flex-start;
  border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px;
  background: var(--surface); margin-bottom: 8px; cursor: pointer;
  transition: border-color var(--motion), background var(--motion);
}
.opt:hover { border-color: var(--border-strong); background: var(--surface-2); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-weak); }
.opt input { margin: 3px 0 0; width: 17px; height: 17px; flex: none; accent-color: var(--accent); }
.opt .txt { font-size: .94rem; }
.opt .txt .lead { font-weight: 550; }
.opt .txt .detail, .opt .txt .obl { color: var(--text-muted); font-size: .87rem; margin-top: 4px; }
.opt .txt .obl { color: var(--accent); }
.opt .refline { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }

.area { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; background: var(--surface); overflow: hidden; }
.area > summary {
  cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center;
  list-style: none; font-weight: 550; font-size: .95rem;
}
.area > summary::-webkit-details-marker { display: none; }
.area > summary .count {
  margin-left: auto; font-size: .78rem; color: var(--accent);
  background: var(--accent-weak); border-radius: 999px; padding: 2px 9px; font-weight: 600;
}
.area > summary .count[hidden] { display: none; }
.area .inner { padding: 0 14px 12px; }
.area .cond { font-size: .84rem; color: var(--text-muted); margin-bottom: 10px; font-style: italic; }
.area.has-sel { border-color: var(--accent); }

.resolved {
  display: flex; gap: 9px; align-items: flex-start;
  border: 1px dashed var(--border-strong); border-radius: 9px;
  padding: 11px 14px; margin-bottom: 18px; font-size: .9rem; background: var(--surface-2);
}
.resolved svg { width: 17px; height: 17px; flex: none; margin-top: 2px; color: var(--accent); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .spacer { flex: 1 1 auto; }
.btn-list { display: grid; gap: 10px; margin-bottom: 20px; }
.btn-opt {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  padding: 14px 16px; border-radius: 9px; border: 1px solid var(--border-strong);
  background: var(--surface); font-size: .98rem; font-weight: 550;
  transition: border-color var(--motion), background var(--motion), transform var(--motion);
}
.btn-opt:hover { border-color: var(--accent); background: var(--accent-weak); }
.btn-opt:active { transform: translateY(1px); }
.btn-opt .mark {
  width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center;
  border: 1px solid var(--border-strong); font-size: .72rem; color: var(--text-muted); font-family: var(--mono);
}
.btn-opt[data-tone="unsure"] { border-style: dashed; font-weight: 500; color: var(--text-muted); }
.btn-opt[data-tone="unsure"]:hover { color: var(--text); }

/* verdict-so-far panel */
aside.verdict { position: sticky; top: 88px; }
@media (max-width: 900px) { aside.verdict { position: static; } }
.verdict .card { padding: 16px; }
.verdict h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 12px; }
.vlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
.vlist li { display: flex; gap: 9px; align-items: flex-start; font-size: .89rem; }
.vlist li.new { animation: highlight 1.1s ease-out; }
@keyframes highlight { from { background: var(--accent-weak); } to { background: transparent; } }
.vlist .mk {
  width: 20px; height: 20px; border-radius: 5px; flex: none; display: grid; place-items: center;
  background: var(--surface-2); color: var(--text-muted);
}
.vlist .mk svg { width: 13px; height: 13px; }
.vlist li[data-color] .mk { background: var(--tone-bg); color: var(--tone); }
.vlist .sub { color: var(--text-muted); font-size: .82rem; }
.vlist li.pending .mk { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
.verdict .empty { color: var(--text-muted); font-size: .88rem; }

/* ---------- result ---------- */
#result { padding: 26px 0 70px; }
#result > .wrap > header { margin-bottom: 22px; }
#result h1 { font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.05rem); margin-bottom: 8px; }
#result .subtitle { color: var(--text-muted); }
.result-cards { display: grid; gap: 16px; margin-bottom: 26px; }
.rcard { border-radius: var(--radius); border: 1px solid var(--border); border-left: 5px solid var(--tone); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.rcard .top { display: flex; gap: 13px; padding: 18px 20px 0; align-items: flex-start; }
.rcard .badge {
  width: 34px; height: 34px; border-radius: 8px; flex: none; display: grid; place-items: center;
  background: var(--tone-bg); color: var(--tone);
}
.rcard .badge svg { width: 19px; height: 19px; }
.rcard .kicker { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--tone); }
.rcard h2 { font-size: 1.16rem; margin: 2px 0 0; }
.rcard .body { padding: 12px 20px 20px 67px; display: grid; gap: 14px; }
@media (max-width: 560px) { .rcard .body { padding-left: 20px; } }
.rcard .summary { font-size: .96rem; }
.rcard h3.lbl { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 6px; }
.rcard ul.obligations { padding-left: 1.15em; display: grid; gap: 5px; font-size: .93rem; }
.rcard .triggered { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface-2); }
.rcard .triggered ul { padding-left: 1.15em; display: grid; gap: 6px; font-size: .9rem; margin-top: 6px; }
.rcard .dates { display: flex; gap: 9px; align-items: flex-start; font-size: .88rem; color: var(--text-muted); }
.rcard .dates svg { width: 16px; height: 16px; flex: none; margin-top: 3px; }
.rcard .refs { display: flex; flex-wrap: wrap; gap: 6px; }

.review-box { border: 1px solid var(--c-yellow); background: var(--c-yellow-bg); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 26px; }
.review-box h2 { font-size: 1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.review-box h2 svg { width: 18px; height: 18px; color: var(--c-yellow); }
.review-box ol { display: grid; gap: 10px; font-size: .92rem; }
.review-box .q { font-weight: 600; }

.section { margin-bottom: 26px; }
.section > h2 { font-size: 1.05rem; margin-bottom: 12px; }

/* answer timeline */
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 14px; }
.timeline .rail { display: flex; flex-direction: column; align-items: center; }
.timeline .rail .dot {
  width: 12px; height: 12px; border-radius: 50%; background: var(--surface);
  border: 2px solid var(--accent); margin-top: 5px; flex: none;
}
.timeline .rail .line { flex: 1 1 auto; width: 2px; background: var(--border); margin: 4px 0; min-height: 8px; }
.timeline li:last-child .rail .line { display: none; }
.timeline .content { padding-bottom: 18px; min-width: 0; }
.timeline .q { font-size: .93rem; font-weight: 550; }
.timeline .a { font-size: .93rem; margin-top: 3px; display: flex; gap: 7px; align-items: baseline; }
.timeline .a .arrow { color: var(--text-muted); flex: none; }
.timeline .meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 6px; }
.timeline ul.sel { padding-left: 1.1em; margin-top: 6px; font-size: .87rem; color: var(--text-muted); display: grid; gap: 3px; }
.timeline .uncertain-tag { color: var(--c-yellow); font-family: var(--mono); font-size: .74rem; }

/* decision map */
.map-wrap { overflow-x: auto; }
.map { min-width: 640px; }
.map text { font: 11px system-ui, sans-serif; fill: var(--text-muted); }
.map .box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
.map .box.on { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-weak); }
.map .box.outcome { stroke-dasharray: 0; }
.map .lbl { fill: var(--text); font-weight: 550; }
.map .edge { stroke: var(--border); stroke-width: 1.5; fill: none; }
.map .edge.on { stroke: var(--accent); stroke-width: 2.5; }
.map .elabel { font-size: 9.5px; }

/* ---------- footer ---------- */
footer.site { border-top: 1px solid var(--border); background: var(--surface); padding: 26px 0 40px; font-size: .87rem; color: var(--text-muted); }
footer.site .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
footer.site h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; color: var(--text); }
footer.site ul { list-style: none; padding: 0; display: grid; gap: 5px; }
footer.site .meta-line { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px 16px; }

#databanner { display: none; margin: 16px 0; border: 1px solid var(--c-red); background: var(--c-red-bg); border-radius: 8px; padding: 12px 14px; font-size: .9rem; }
#databanner ul { margin-top: 6px; }

.print-only { display: none; }

/* ---------- print / PDF ---------- */
@media print {
  :root {
    --bg: #fff; --surface: #fff; --surface-2: #fff; --border: #b0b0b0; --border-strong: #808080;
    --text: #000; --text-muted: #333; --accent: #000; --accent-weak: #fff; --shadow: none;
    --c-grey: #444; --c-red: #000; --c-orange: #000; --c-yellow: #000; --c-green: #000; --c-blue: #000; --c-purple: #000;
    --c-grey-bg: #fff; --c-red-bg: #fff; --c-orange-bg: #fff; --c-yellow-bg: #fff; --c-green-bg: #fff; --c-blue-bg: #fff; --c-purple-bg: #fff;
  }
  header.site, aside.verdict, .no-print, .stepper, #databanner { display: none !important; }
  .print-only { display: block; }
  body { background: #fff; font-size: 11.5pt; }
  .wrap { max-width: none; padding: 0; }
  #result { padding: 0; }
  .card, .rcard, .review-box { box-shadow: none; break-inside: avoid; }
  .rcard { border: 1px solid #999; border-left: 4px solid #000; }
  details.disclosure > .body, .area .inner { display: block !important; }

  "nodes": {
    "S0_ai_system": {
      "module": "SPINE",
      "type": "question",
      "text": "Does your system qualify as an 'AI system' under the AI Act?",
      "explainer": "Article 3(1) defines an AI system as a machine-based system that (a) is designed to operate with varying levels of autonomy, (b) may show adaptiveness after deployment, and (c) for explicit or implicit objectives, INFERS from the input it receives how to generate outputs such as predictions, content, recommendations or decisions that can influence physical or virtual environments. The key element is 'inference': the system derives outputs from data using techniques such as machine learning or knowledge/logic-based approaches, rather than executing only rules defined solely by natural persons.",
      "help": {
        "likelyYes": [
          "Uses machine learning (supervised, unsupervised, reinforcement, deep learning)",
          "Uses knowledge- or logic-based inference, expert systems, or search/optimisation that infers solutions",
          "Generates content, predictions, recommendations or decisions from data with some autonomy"
        ],
        "likelyNo": [
          "Systems for improving mathematical optimisation only, or that merely speed up classical methods",
          "Basic data processing following rules defined solely by natural persons (e.g. a spreadsheet with fixed formulas, a static database query)",
          "Systems based on classical heuristics with no learning/inference",
          "Simple prediction using a single basic statistical rule"
        ]
      },
      "articleRef": "Art. 3(1); Guidelines on the definition of an AI system (C(2025) 5053)",
      "options": [
        { "label": "Yes – it meets the Article 3(1) definition", "value": "yes", "next": "S1_prohibited" },
        { "label": "No – it only executes rules defined solely by natural persons", "value": "no", "next": "OUT_OF_SCOPE" },
        { "label": "I'm not sure whether it 'infers'", "value": "unsure", "next": "S1_prohibited", "uncertain": true, "reviewNote": "Whether the system 'infers' outputs within the meaning of Art. 3(1) was not established. The assessment continued on the assumption that it is an AI system. Verify against the Commission Guidelines on the definition of an AI system (C(2025) 5053)." }
      ]
    },

      "type": "question",
      "text": "Does the system's intended purpose or use match any PROHIBITED practice under Article 5?",

      "checklist": "prohibitedPractices",
      "multiSelect": true,
      "selectionRule": "anySelected",
      "options": [

        { "label": "No – none of these apply", "value": "no", "next": "S2_annex_i_product" }
      ]

      "module": "SPINE",
      "type": "question",
      "text": "Is the AI system itself a product, OR a safety component of a product, covered by one of the Union harmonisation laws listed in Annex I?",
      "explainer": "Article 6(1) – first cumulative condition. Annex I lists EU product-safety legislation (e.g. machinery, toys, lifts, medical devices, in-vitro diagnostics, radio equipment, pressure equipment, PPE, cableways, gas appliances, and the automotive, aviation, rail and marine sectors). A 'safety component' (Art. 3(14)) is a component whose failure/malfunction endangers health and safety, OR that fulfils a safety function. Comfort/efficiency/optimisation functions are generally NOT safety functions, but a system can still be a safety component if its failure would endanger health or safety.",
      "help": {
        "likelyYes": [
          "The AI is (or is embedded in) a regulated product like a medical device, machine, vehicle, lift, toy, radio equipment",
          "The AI performs a safety function (e.g. detects human presence and triggers a safe stop; prevents collisions)",
          "Failure/malfunction of the AI could endanger persons or property (e.g. lane assistance, lift door control)"
        ],
        "likelyNo": [
          "The AI only optimises comfort, efficiency, performance or convenience and its failure would cause only inconvenience/cost (e.g. a smart thermostat learning routines, music recommendation in a connected toy, yield forecasting)",
          "The product is not covered by any Annex I legislation at all"
        ]
      },
      "articleRef": "Art. 6(1); Art. 3(14); Annex I",
      "reference": "annexI_legislation",
      "options": [
        { "label": "Yes – covered by Annex I legislation (as product or safety component)", "value": "yes", "next": "S3_annex_i_tpca" },
        { "label": "No", "value": "no", "next": "S4_annex_iii_area" },
        { "label": "I'm not sure (e.g. unclear whether it is a safety component)", "value": "unsure", "next": "S3_annex_i_tpca", "uncertain": true, "reviewNote": "It was not established whether the system is a product or a safety component under Annex I legislation (Art. 3(14) test). The assessment continued on the assumption that it is. Have the applicable product legislation and the safety-component test reviewed." }

      "articleRef": "Art. 6(3) third sub-para; Art. 4(4) GDPR",

    "S6_filter": {
      "module": "SPINE",
      "type": "question",
      "text": "Does the system meet at least ONE of the four Article 6(3) 'filter' conditions AND not materially influence the outcome of decision-making?",
      "explainer": "Article 6(3) lets a provider treat an Annex III system as NOT high-risk if it does not pose a significant risk of harm because it meets at least one of four exhaustive-but-alternative conditions (below). The overriding test is that the system must NOT materially influence the outcome of decision-making. The conditions are interpreted narrowly. NOTE: the filter does NOT apply if the system is part of a complex/agentic configuration whose combined outputs materially influence a decision in a high-risk use case, nor to Article 6(1)/Annex I systems.",

      "checklist": "filterConditions",
      "multiSelect": true,
      "selectionRule": "anySelectedAndSubNo",
      "subQuestion": {

        { "label": "No – none of the conditions applies, or it does materially influence the outcome", "value": "no", "next": "HIGH_RISK_ANNEX_III" }

/* ---- interface strings: every one of them comes from decision-tree.json → ui ----

  const s = UI[key];
  if (s == null) return `⟨${key}⟩`;
  return Array.isArray(s) ? s : interpolate(s, vars);
}
/* singular/plural pairs are stored as key.one / key.many */
const tn = (base, n) => t(`${base}.${n === 1 ? "one" : "many"}`, { n });

function icon(name, cls = "") {
  const d = ICONS[name] || ICONS.info;
  return `<svg ${cls ? `class="${cls}" ` : ""}viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
}
/* inline style that binds a card/marker to a semantic tier colour */
const toneStyle = (color) => `--tone: var(--c-${color || "grey"}); --tone-bg: var(--c-${color || "grey"}-bg);`;
/* compact label for an outcome (legend, verdict panel, heading, map) */
const shortOf = (oc) => (oc && (oc.shortTitle || String(oc.title || "").split(" – ")[0])) || "";

/* =========================================================================
   1. ENGINE — pure logic, no DOM. Driven entirely by decision-tree.json.
      (Kept between these markers so test-scenarios.mjs can run the very
      same code that ships in the page.)
   ========================================================================= */
/* ===== ENGINE START ===== */
function validateTree(tree) {
  const errors = [];
  const req = ["meta", "resultModel", "moduleOrder", "nodes", "outcomes", "catalog"];
  for (const k of req) if (!tree || !tree[k]) errors.push(`missing top-level key "${k}"`);
  if (errors.length) return errors;

  const isTarget = (id) => Object.hasOwn(tree.nodes, id) || Object.hasOwn(tree.outcomes, id);
  for (const [id, node] of Object.entries(tree.nodes)) {
    if (!node.module) errors.push(`node ${id}: missing "module"`);
    if (!node.type) errors.push(`node ${id}: missing "type"`);
    if (node.type !== "question") continue;
    if (!Array.isArray(node.options) || !node.options.length) errors.push(`node ${id}: no options`);
    for (const o of node.options || []) {
      if (!o.value) errors.push(`node ${id}: option without "value"`);
      if (!isTarget(o.next)) errors.push(`node ${id}: option "${o.value}" points at unknown target "${o.next}"`);
    }
    if (node.checklist && !tree.catalog[node.checklist]) errors.push(`node ${id}: unknown checklist "${node.checklist}"`);
    if (node.reference && !tree.catalog[node.reference]) errors.push(`node ${id}: unknown reference "${node.reference}"`);
    if (node.selectionRule && !["anySelected", "anySelectedAndSubNo"].includes(node.selectionRule)) {
      errors.push(`node ${id}: unsupported selectionRule "${node.selectionRule}"`);
    }
    if (node.selectionRule === "anySelectedAndSubNo" && !node.subQuestion) {
      errors.push(`node ${id}: selectionRule needs a subQuestion`);
    }
  }
  for (const [id, oc] of Object.entries(tree.outcomes)) {
    for (const k of ["tier", "color", "title", "summary"]) {
      if (!oc[k]) errors.push(`outcome ${id}: missing "${k}"`);
    }
  }
  if (!tree.nodes.RESULT) errors.push('missing the "RESULT" node');
  if (!tree.ui || typeof tree.ui !== "object") errors.push('missing the "ui" block with the interface strings');
  return errors;
}

function createEngine(tree, startNodeId = "S0_ai_system") {
  const outcomeIds = new Set(Object.keys(tree.outcomes));

  /* local string lookup, so the engine stays independent of the UI layer */
  const tt = (key, vars) => {
    const s = (tree.ui || {})[key];
    if (s == null) return `⟨${key}⟩`;
    return String(s).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? String(vars[k]) : m));
  };
  const ttn = (base, n) => tt(`${base}.${n === 1 ? "one" : "many"}`, { n });

  const freshState = () => ({
    currentNodeId: startNodeId,
    answers: [],                                        // the audit trail
    flags: { primaryTier: null, transparency: [], gpai: "none" },
    review: [],                                         // points flagged for expert review
    finished: false
  });

  let state = freshState();
  let stack = [];        // state snapshots, for Back
  const memory = {};     // last input per node, so rewinding never loses answers

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const node = (id) => tree.nodes[id];

  /* selection screens derive their yes/no from what the user ticked */
  function resolveValue(n, input) {
    if (!n.selectionRule) return input.value;
    const any = (input.selections || []).length > 0;
    if (n.selectionRule === "anySelected") return any ? "yes" : "no";
    if (n.selectionRule === "anySelectedAndSubNo") return any && input.sub === "no" ? "yes" : "no";
    return input.value;
  }

  /* which catalog items were ticked, resolved to their full objects */
  function selectedItems(n, ids) {
    const cat = tree.catalog[n.checklist] || tree.catalog[n.reference];
    if (!cat || !ids || !ids.length) return [];
    const flat = cat.items
      ? cat.items
      : (cat.areas || []).flatMap(a => (a.useCases || []).map(u => ({ ...u, id: u.ref, area: a.area })));
    return ids.map(id => flat.find(i => i.id === id || i.ref === id)).filter(Boolean);
  }

  function submit(input) {
    const n = node(state.currentNodeId);
    if (!n || n.type !== "question" || state.finished) return state;

    stack.push({ state: clone(state) });
    memory[state.currentNodeId] = clone(input);

    const value = resolveValue(n, input);
    const option = n.options.find(o => o.value === value);
    if (!option) { stack.pop(); return state; }

    const items = selectedItems(n, input.selections);
    const subOption = n.subQuestion
      ? (n.subQuestion.options.find(o => o.value === input.sub) || null)
      : null;

    /* --- side effects --- */
    for (const src of [option, subOption]) {
      if (src && src.uncertain) {
        state.review.push({
          nodeId: n.id || state.currentNodeId,
          question: src === subOption ? n.subQuestion.text : n.text,
          answer: src.label,
          articleRef: (src === subOption ? n.subQuestion.articleRef : n.articleRef) || "",
          note: src.reviewNote || ""
        });
      }
    }
    if (n.setsFlag === "transparency") state.flags.transparency = items.map(i => i.id);
    if (option.setsGpai) state.flags.gpai = option.setsGpai;

    /* --- audit trail --- */
    state.answers.push({
      nodeId: state.currentNodeId,
      module: n.module,
      question: n.text,
      articleRef: n.articleRef || "",
      value,
      answerLabel: option.label,
      uncertain: !!(option.uncertain || (subOption && subOption.uncertain)),
      selections: items.map(i => ({ ref: i.ref, label: i.label, area: i.area || null, obligation: i.obligation || null })),
      sub: subOption ? { text: n.subQuestion.text, label: subOption.label, value: subOption.value } : null
    });

    /* --- routing, per SPEC §7 --- */
    let next = option.next;
    if (outcomeIds.has(next)) {
      state.flags.primaryTier = next;
      if (next === "OUT_OF_SCOPE") {
        state.currentNodeId = "RESULT"; state.finished = true; return state;   // hard stop
      }
      next = next === "PROHIBITED" ? "G0_gpai" : "T0_transparency";            // prohibited skips transparency
    }
    state.currentNodeId = next;
    if (next === "RESULT" || node(next).type === "result") {
      if (!state.flags.primaryTier) state.flags.primaryTier = "MINIMAL_RISK";
      state.finished = true;
    }
    return state;
  }

  function back() {
    const prev = stack.pop();
    if (prev) state = prev.state;
    return state;
  }

  /* jump back to an already-answered question, keeping later answers in memory */
  function editFrom(nodeId) {
    const idx = stack.findIndex(s => s.state.currentNodeId === nodeId);
    if (idx === -1) return state;
    state = stack[idx].state;
    stack = stack.slice(0, idx);
    return state;
  }

  function compileCards() {
    const f = state.flags;
    const cards = [];
    if (f.primaryTier) cards.push({ id: f.primaryTier, ...tree.outcomes[f.primaryTier], role: "primary" });
    const tier = f.primaryTier ? tree.outcomes[f.primaryTier].tier : null;
    if (f.transparency.length && !["out_of_scope", "prohibited"].includes(tier)) {
      cards.push({ id: "TRANSPARENCY", ...tree.outcomes.TRANSPARENCY, role: "overlay" });
    }
    if (f.gpai !== "none") {
      const id = f.gpai === "gpai_model_systemic" ? "GPAI_MODEL_SYSTEMIC" : "GPAI_MODEL";
      cards.push({ id, ...tree.outcomes[id], role: "overlay" });
    }
    return cards;
  }

  /* phase stepper state, derived – never a fake percentage */
  function phases() {
    const defs = tree.phases || (tree.moduleOrder || []).filter(m => m !== "RESULT")
      .map(m => ({ id: m, label: m, shortLabel: m, module: m, nodes: Object.entries(tree.nodes).filter(([, n]) => n.module === m).map(([id]) => id) }));
    const answered = new Set(state.answers.map(a => a.nodeId));
    const currentIdx = defs.findIndex(p => p.nodes.includes(state.currentNodeId));
    return defs.map((p, i) => {
      const visited = p.nodes.some(id => answered.has(id));
      let st;
      if (!state.finished && i === currentIdx) st = "current";
      else if (visited) st = "done";
      else if (state.finished || (currentIdx > -1 && i < currentIdx)) st = "skipped";
      else st = "upcoming";
      return { ...p, state: st };
    });
  }

  /* the live "verdict so far" lines */
  function verdict() {
    const lines = [];
    const byNode = {};
    for (const a of state.answers) byNode[a.nodeId] = a;
    const f = state.flags;

    if (byNode.S0_ai_system) {
      const a = byNode.S0_ai_system;
      lines.push(a.value === "yes"
        ? { icon: "check", color: "green", text: tt("verdict.isAiSystem"), sub: "Art. 3(1)" }
        : a.value === "unsure"
          ? { icon: "question", color: "yellow", text: tt("verdict.aiSystemUnclear"), sub: tt("verdict.conservativeSub") }
          : { icon: "circle-slash", color: "grey", text: tt("verdict.notAiSystem"), sub: "Art. 3(1)" });
    }
    if (byNode.S1_prohibited) {
      lines.push(byNode.S1_prohibited.value === "yes"
        ? { icon: "ban", color: "red", text: tt("verdict.prohibitedFound"), sub: "Art. 5" }
        : { icon: "check", color: "green", text: tt("verdict.noProhibited"), sub: "Art. 5" });
    }

    const tierId = f.primaryTier;
    const tierResolved = tierId && !["OUT_OF_SCOPE", "PROHIBITED"].includes(tierId);
    const inTier = ["S2_annex_i_product", "S3_annex_i_tpca", "S4_annex_iii_area", "S5_profiling", "S6_filter"]
      .some(id => byNode[id]);
    /* self-contained inside the engine: no dependency on UI helpers */
    const short = (oc) => oc.shortTitle || String(oc.title || "").split(" – ")[0];
    if (tierResolved) {
      const oc = tree.outcomes[tierId];
      lines.push({ icon: oc.icon, color: oc.color, text: short(oc), sub: (oc.legalRefs || [])[0] || "" });
    } else if (inTier && !state.finished) {
      lines.push({ icon: "dots", color: null, text: tt("verdict.assessingTier"), pending: true });
    } else if (state.finished && tierId === "MINIMAL_RISK") {
      const oc = tree.outcomes.MINIMAL_RISK;
      lines.push({ icon: oc.icon, color: oc.color, text: short(oc), sub: tt("verdict.minimalSub") });
    }

    if (byNode.T0_transparency) {
      const n = f.transparency.length;
      lines.push(n
        ? { icon: "plus", color: "blue", text: tt("verdict.transparencyAdded", { n }), sub: "Art. 50" }
        : { icon: "check", color: "green", text: tt("verdict.noTransparency"), sub: "Art. 50" });
    }
    if (byNode.G1_systemic || (byNode.G0_gpai && byNode.G0_gpai.value === "no")) {
      const gpaiCard = f.gpai === "gpai_model_systemic" ? tree.outcomes.GPAI_MODEL_SYSTEMIC : tree.outcomes.GPAI_MODEL;
      lines.push(f.gpai === "none"
        ? { icon: "check", color: "green", text: tt("verdict.notGpai"), sub: "Art. 3(63)" }
        : { icon: gpaiCard.icon, color: gpaiCard.color, text: short(gpaiCard), sub: (gpaiCard.legalRefs || []).join(" + ") });
    }
    if (state.review.length) {
      lines.push({ icon: "question", color: "yellow", text: ttn("verdict.reviewPoints", state.review.length), sub: tt("verdict.reviewSub") });
    }
    return lines;
  }

  return {
    tree,
    get state() { return state; },
    get memory() { return memory; },
    canGoBack: () => stack.length > 0,
    currentNode: () => ({ id: state.currentNodeId, ...node(state.currentNodeId) }),
    submit, back, editFrom, compileCards, phases, verdict, selectedItems,
    resolveValue,
    reset() { state = freshState(); stack = []; return state; }
  };
}
/* ===== ENGINE END ===== */

/* =========================================================================
   2. UI
   ========================================================================= */
let TREE = null, E = null, prevVerdictLen = 0;

/* ---- data loading -------------------------------------------------------
   1. ?lang=nl  ->  decision-tree.nl.json   (drop a translated copy next to this file)
   2. decision-tree.json
   3. the embedded copy (needed for file:// where fetch is blocked)
   A candidate that fails validation is skipped and reported in the banner. */
async function loadTree() {
  const lang = new URLSearchParams(location.search).get("lang");
  const candidates = [];
  if (lang && /^[a-z]{2}(-[a-z]{2})?$/i.test(lang)) candidates.push(`decision-tree.${lang.toLowerCase()}.json`);
  candidates.push("decision-tree.json");

  let errors = null;
  for (const file of candidates) {
    let json = null;
    try {
      const res = await fetch(file, { cache: "no-cache" });
      if (res.ok) json = await res.json();
    } catch (_) { /* not hosted, or file:// – try the next candidate */ }
    if (!json) continue;
    const errs = validateTree(json);
    if (!errs.length) return { tree: json, sourceKey: "source.external", sourceFile: file };
    errors = errors || errs;
  }
  const embedded = JSON.parse($("#decision-tree-data").textContent);
  return {
    tree: embedded,
    sourceKey: errors ? "source.embeddedFallback" : "source.embedded",
    errors
  };
}

function showDataErrors(title, errors) {
  const el = $("#databanner");
  el.innerHTML = `<strong>${esc(title)}</strong><ul>${errors.slice(0, 12).map(e => `<li>${esc(e)}</li>`).join("")}</ul>`;
  el.style.display = "block";
}

/* ---------- start screen ---------- */

  const m = TREE.meta;
  $("#brand-title").textContent = m.title;
  $("#brand-sub").textContent = `${m.regulation} · v${m.version}`;
  document.title = m.title;
  $("#start-h").textContent = t("start.headline");
  $("#start-purpose").textContent = m.purpose;
  $("#start-disclaimer").innerHTML = `<strong>${esc(t("start.disclaimerLabel"))}</strong>${esc(m.disclaimer)}`;
  $("#start-legend").setAttribute("aria-label", t("start.legendLabel"));
  $("#progress-nav").setAttribute("aria-label", t("progress.label"));
  $("#verdict-h").textContent = t("verdict.title");
  $("#btn-restart-label").textContent = t("chrome.restart");
  $("#start-model-summary").textContent = t("start.modelSummary");
  $("#btn-start").innerHTML = `${esc(t("start.button"))}${icon("arrowRight")}`;
  $("#start-facts").innerHTML = [1, 2, 3].map(i =>
    `<div class="f"><b>${esc(t(`start.fact${i}.label`))}</b><span>${esc(t(`start.fact${i}.text`))}</span></div>`).join("");

  const order = ["OUT_OF_SCOPE", "PROHIBITED", "HIGH_RISK_ANNEX_I", "HIGH_RISK_ANNEX_III", "NOT_HIGH_RISK_FILTERED", "MINIMAL_RISK", "TRANSPARENCY", "GPAI_MODEL"];
  $("#start-legend").innerHTML = order.filter(id => TREE.outcomes[id]).map(id => {
    const oc = TREE.outcomes[id];
    return `<span class="item" style="${toneStyle(oc.color)}"><span style="color: var(--tone); display:inline-flex">${icon(oc.icon)}</span>${esc(shortOf(oc))}</span>`;
  }).join("");

  const rm = TREE.resultModel;
  $("#start-model").innerHTML = `
    <p>${esc(rm.description)}</p>
    <ul style="margin-top:10px; display:grid; gap:6px">
      ${Object.entries(rm.dimensions).map(([k, v]) => `<li><b>${esc(k)}</b> — ${esc(v)}</li>`).join("")}
    </ul>
    <p style="margin-top:12px"><b>${esc(t("start.shortCircuitsLabel"))}</b></p>
    <ul style="display:grid; gap:6px">${(rm.shortCircuits || []).map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <p style="margin-top:12px" class="note">${esc(TREE.meta.uncertaintyPolicy || "")}</p>`;

  $("#foot-links").innerHTML = (m.links || []).map(l =>
    `<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a></li>`).join("");
  $("#foot-sources").innerHTML = (m.sources || []).map(s => `<li>${esc(s)}</li>`).join("");
  $("#foot-dates").innerHTML = Object.entries(m.keyDates || {}).map(([k, v]) =>
    `<li><b style="color:var(--text)">${esc(t(`footer.date.${k}`))}:</b> ${esc(v)}</li>`).join("")

  $("#foot-h-help").textContent = t("footer.help");
  $("#foot-h-sources").textContent = t("footer.sources");
  $("#foot-h-dates").textContent = t("footer.dates");
  $("#foot-version").textContent = t("chrome.versionLine", { version: m.version, date: m.lastUpdated });
  $("#foot-regulation").textContent = m.regulation;
}

/* ---------- progress stepper ---------- */
function renderStepper() {
  const phases = E.phases();
  const stateWords = {
    current: t("progress.state.current"), done: t("progress.state.done"),
    skipped: t("progress.state.skipped"), upcoming: t("progress.state.upcoming")
  };
  $("#stepper").innerHTML = phases.map((p, i) => `
    <li data-state="${p.state}" ${p.state === "current" ? 'aria-current="step"' : ""}>
      <div class="seg">
        <span class="dot">${p.state === "done" ? icon("check") : (p.state === "skipped" ? "–" : i + 1)}</span>
        <span class="lbl">${esc(p.label)}</span>
        <span class="visually-hidden">: ${stateWords[p.state]}${p.state === "skipped" ? " (n/a)" : ""}</span>
      </div>
    </li>`).join("");
  const cur = phases.find(p => p.state === "current");
  const idx = phases.findIndex(p => p.state === "current");
  $("#stepper-mobile").textContent = cur
    ? t("progress.mobile", { n: idx + 1, total: phases.length, label: cur.label })
    : "";
}

/* ---------- verdict-so-far ---------- */
function renderVerdict() {
  const lines = E.verdict();
  const body = $("#verdict-body");
  if (!lines.length) {
    body.innerHTML = `<p class="empty">${esc(t("verdict.empty"))}</p>`;
    prevVerdictLen = 0;
    return;
  }
  body.innerHTML = `<ul class="vlist">${lines.map((l, i) => `
    <li ${l.color ? `data-color="${l.color}" style="${toneStyle(l.color)}"` : ""} class="${l.pending ? "pending" : ""} ${i >= prevVerdictLen ? "new" : ""}">
      <span class="mk">${icon(l.icon)}</span>
      <span><span>${esc(l.text)}</span>${l.sub ? `<br><span class="sub">${esc(l.sub)}</span>` : ""}</span>
    </li>`).join("")}</ul>`;
  prevVerdictLen = lines.length;
}

/* ---------- question screen ---------- */
function itemRow(item, { name, type, checked }) {
  const id = `${name}__${(item.id || item.ref).replace(/[^\w-]/g, "_")}`;
  return `
  <label class="opt" for="${esc(id)}">
    <input type="${type}" id="${esc(id)}" name="${esc(name)}" value="${esc(item.id || item.ref)}" ${checked ? "checked" : ""}>
    <span class="txt">
      <span class="refline">
        ${item.ref ? `<span class="chip art">${esc(item.ref)}</span>` : ""}
        <span class="lead">${esc(item.label)}</span>
      </span>
      ${item.detail ? `<span class="detail">${esc(item.detail)}</span>` : ""}
      ${item.obligation ? `<span class="obl">${esc(t("question.obligationPrefix"))} ${esc(item.obligation)}</span>` : ""}
    </span>
  </label>`;
}

function renderScreen() {
  const n = E.currentNode();
  if (n.type === "result" || E.state.finished) return renderResult();

  const mem = E.memory[n.id] || {};
  const selection = new Set(mem.selections || []);
  const cat = n.checklist ? TREE.catalog[n.checklist] : null;
  const refCat = n.reference ? TREE.catalog[n.reference] : null;
  const grouped = refCat && refCat.areas ? refCat : null;      // Annex III: grouped multi-select
  const isSelectionScreen = !!n.selectionRule;

  const parts = [];

  parts.push(`<div class="q-head">
    ${n.articleRef ? `<span class="chip art">${esc(n.articleRef)}</span>` : ""}
  </div>
  <h2 class="q-text" id="q-text" tabindex="-1">${esc(n.text)}</h2>
  <p class="q-explainer">${esc(n.explainer || "")}</p>`);

  /* collapsible help + reference panels */
  const panels = [];
  if (n.help && (n.help.likelyYes || n.help.likelyNo)) {
    panels.push(`<details class="disclosure"><summary>${esc(t("question.helpSummary"))}</summary><div class="body">
      <div class="help-cols">
        ${n.help.likelyYes ? `<div><h4>${esc(t("question.likelyYes"))}</h4><ul>${n.help.likelyYes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
        ${n.help.likelyNo ? `<div><h4>${esc(t("question.likelyNo"))}</h4><ul>${n.help.likelyNo.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      </div></div></details>`);
  }
  if (refCat && !grouped) {   // Annex I: informational prompt list
    panels.push(`<details class="disclosure"><summary>${esc(t("question.referenceSummary", { ref: refCat.articleRef || n.reference }))}</summary><div class="body">
      ${refCat.note ? `<p class="note" style="margin-bottom:12px">${esc(refCat.note)}</p>` : ""}
      <div class="help-cols">
        ${refCat.sectionA ? `<div><h4>${esc(t("question.sectionA"))}</h4><ul>${refCat.sectionA.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
        ${refCat.sectionB ? `<div><h4>${esc(t("question.sectionB"))}</h4><ul>${refCat.sectionB.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      </div></div></details>`);
  }
  if (grouped && grouped.horizontalNotes) {
    panels.push(`<details class="disclosure"><summary>${esc(t("question.annexIIINotes"))}</summary><div class="body">
      <ul>${grouped.horizontalNotes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></details>`);
  }
  if (panels.length) parts.push(`<div class="panels">${panels.join("")}</div>`);

  /* selection body */
  if (cat) {
    parts.push(`<fieldset class="choices">
      <legend>${esc(t("question.checklistLegend", { ref: cat.articleRef || "" }))}</legend>
      ${cat.note ? `<p class="note" style="margin-bottom:12px">${esc(cat.note)}</p>` : ""}
      ${cat.items.map(it => itemRow(it, { name: "sel", type: "checkbox", checked: selection.has(it.id) })).join("")}
      ${cat.overrides ? `<div class="note" style="margin-top:10px"><b>${esc(t("question.overrides"))}</b><ul style="margin-top:4px">${cat.overrides.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>` : ""}
    </fieldset>`);
  }
  if (grouped) {
    parts.push(`<fieldset class="choices">
      <legend>${esc(t("question.annexIIILegend", { ref: grouped.articleRef }))}</legend>
      ${grouped.areas.map(a => {
        const sel = (a.useCases || []).filter(u => selection.has(u.ref)).length;
        return `<details class="area ${sel ? "has-sel" : ""}" ${sel ? "open" : ""}>
          <summary><span class="chip">${esc(t("question.area", { n: a.id }))}</span> ${esc(a.area)}<span class="count" ${sel ? "" : "hidden"}>${esc(t("question.selectedCount", { n: sel }))}</span></summary>
          <div class="inner">
            ${a.condition ? `<p class="cond">${esc(a.condition)}</p>` : ""}
            ${(a.useCases || []).map(u => itemRow({ ...u, id: u.ref }, { name: "sel", type: "checkbox", checked: selection.has(u.ref) })).join("")}
          </div></details>`;
      }).join("")}
    </fieldset>`);
  }
  if (n.subQuestion) {
    const sq = n.subQuestion;
    parts.push(`<fieldset class="choices" id="subq">
      <legend>${esc(sq.text)} ${sq.articleRef ? `<span class="chip art">${esc(sq.articleRef)}</span>` : ""}</legend>
      ${sq.explainer ? `<p class="note" style="margin-bottom:12px">${esc(sq.explainer)}</p>` : ""}
      ${sq.options.map(o => itemRow({ id: o.value, label: o.label }, { name: "sub", type: "radio", checked: mem.sub === o.value })).join("")}
    </fieldset>`);
  }

  /* actions */
  if (isSelectionScreen) {
    parts.push(`<div class="resolved" id="resolved" aria-live="polite"></div>
      <div class="actions">
        <button class="btn primary" id="btn-continue">${esc(t("question.continue"))} ${icon("arrowRight")}</button>
        ${E.canGoBack() ? `<button class="btn ghost" id="btn-back">${esc(t("question.back"))}</button>` : ""}
      </div>`);
  } else {
    parts.push(`<div class="btn-list" role="group" aria-labelledby="q-text">
      ${n.options.map((o, i) => `<button class="btn-opt" data-value="${esc(o.value)}" data-tone="${o.uncertain ? "unsure" : "plain"}">
        <span class="mark">${o.uncertain ? "?" : String.fromCharCode(65 + i)}</span>
        <span>${esc(o.label)}</span>
      </button>`).join("")}
    </div>
    <div class="actions">${E.canGoBack() ? `<button class="btn ghost" id="btn-back">${esc(t("question.back"))}</button>` : ""}</div>`);
  }

  const screen = $("#screen");
  screen.innerHTML = parts.join("");

  /* wiring */
  const back = $("#btn-back", screen);
  if (back) back.onclick = () => { E.back(); paint({ focus: true }); };

  if (isSelectionScreen) {
    const updateResolved = () => {
      const input = readSelectionInput(screen, n);
      const value = E.resolveValue(n, input);
      const opt = n.options.find(o => o.value === value);
      const needSub = n.subQuestion && !input.sub;
      $("#btn-continue", screen).disabled = needSub;
      $("#resolved", screen).innerHTML = needSub
        ? `${icon("info")}<span>${esc(t("question.answerSubFirst"))}</span>`
        : `${icon("arrowRight")}<span><b>${esc(t("question.countsAs"))}</b> ${esc(opt ? opt.label : value)}</span>`;
      /* keep the Annex III area chips in sync */
      screen.querySelectorAll("details.area").forEach(d => {
        const boxes = [...d.querySelectorAll('input[name="sel"]')];
        const c = boxes.filter(b => b.checked).length;
        d.classList.toggle("has-sel", c > 0);
        const badge = d.querySelector(".count");
        if (badge) { badge.textContent = t("question.selectedCount", { n: c }); badge.hidden = c === 0; }
      });
    };
    screen.querySelectorAll('input[name="sel"], input[name="sub"]').forEach(el => el.addEventListener("change", updateResolved));
    updateResolved();
    $("#btn-continue", screen).onclick = () => {
      E.submit(readSelectionInput(screen, n));
      paint({ focus: true });
    };
  } else {
    screen.querySelectorAll(".btn-opt").forEach(b => {
      b.onclick = () => { E.submit({ value: b.dataset.value }); paint({ focus: true }); };
    });
  }
}

function readSelectionInput(screen, n) {
  const selections = [...screen.querySelectorAll('input[name="sel"]:checked')].map(i => i.value);
  const subEl = screen.querySelector('input[name="sub"]:checked');
  return { selections, sub: subEl ? subEl.value : (n.subQuestion ? null : undefined) };
}

    ${st.review.length ? `<div class="review-box">

      <ol>${st.review.map(r => `<li>

    <div class="section">

      <ol class="timeline">

        <li>
          <div class="rail"><div class="dot" style="background:var(--accent)"></div></div>
          <div class="content"><div class="q">${esc(t("result.pathResultLabel"))}</div><div class="a">${esc(heading)}</div></div>
        </li>
      </ol>
    </div>

    <div class="section no-print">
      <details class="disclosure" id="map-toggle">
        <summary>${esc(t("result.mapSummary"))}</summary>
        <div class="body"><div class="map-wrap" id="map-holder"></div></div>
      </details>
    </div>

    <div class="section">
      <h2>${esc(t("result.nextTitle"))}</h2>
      <div class="card" style="padding:16px 18px">
        <ol style="display:grid; gap:8px; font-size:.94rem">
          ${(t("result.nextSteps") || []).map(s => `<li>${esc(s)}</li>`).join("")}
        </ol>
        <ul style="list-style:none; padding:0; margin-top:14px; display:grid; gap:6px">
          ${(m.links || []).map(l => `<li>${icon("arrowRight")} <a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a></li>`).join("")}
        </ul>
      </div>
    </div>

    <div class="disclaimer"><strong>${esc(t("start.disclaimerLabel"))}</strong>${esc(m.disclaimer)}</div>
    <p style="font-size:.85rem; color:var(--text-muted)">${esc(t("result.draftNote", { version: m.version, date: m.lastUpdated, regulation: m.regulation }))}</p>
  </div>`;

  const sec = $("#result");
  sec.innerHTML = html;
  sec.hidden = false;
  $("#app").hidden = true;

  $("#btn-back-result").onclick = () => { E.back(); paint({ focus: true }); };
  $("#btn-restart-2").onclick = restart;
  $("#map-toggle").addEventListener("toggle", (e) => {
    if (e.target.open && !$("#map-holder").innerHTML) $("#map-holder").innerHTML = decisionMapSVG();

function resultCard(c, triggered) {

    : "";
  return `<article class="rcard" style="${toneStyle(c.color)}">
    <div class="top">
      <span class="badge">${icon(c.icon)}</span>

        <div class="kicker">${esc(kicker)}</div>

      </div>
    </div>
    <div class="body">
      <p class="summary">${esc(c.summary)}</p>

      ${(c.obligations || []).length ? `<div>

function timelineItem(a) {

      <div class="q">${esc(a.question)}</div>

/* ---------- decision map (result screen only, opt-in) ---------- */
function decisionMapSVG() {
  const qNodes = Object.entries(TREE.nodes).filter(([, n]) => n.type === "question").map(([id]) => id);
  const taken = new Set(E.state.answers.map(a => a.nodeId));
  const takenEdges = new Set(E.state.answers.map(a => `${a.nodeId}>${
    (TREE.nodes[a.nodeId].options.find(o => o.value === a.value) || {}).next}`));

  const rowH = 62, boxW = 250, boxH = 40, x1 = 10, x2 = 330, pad = 20;
  const rows = {};
  qNodes.forEach((id, i) => { rows[id] = i; });

  /* place each outcome on the row of the first question that can reach it */
  const outcomeRows = {};
  qNodes.forEach(id => {
    for (const o of TREE.nodes[id].options) {
      if (TREE.outcomes[o.next] && outcomeRows[o.next] === undefined) outcomeRows[o.next] = rows[id];
    }
  });
  const used = new Set();
  for (const k of Object.keys(outcomeRows)) {           // avoid overlapping outcome boxes
    let r = outcomeRows[k];
    while (used.has(r)) r += 1;
    outcomeRows[k] = r; used.add(r);
  }
  const maxRow = Math.max(...Object.values(rows), ...Object.values(outcomeRows));
  const h = (maxRow + 1) * rowH + pad;
  const cy = (r) => pad + r * rowH + boxH / 2;

  const parts = [];
  /* edges */
  qNodes.forEach(id => {
    const n = TREE.nodes[id];
    n.options.forEach(o => {
      const on = takenEdges.has(`${id}>${o.next}`);
      const fromY = cy(rows[id]);
      if (TREE.outcomes[o.next]) {
        const toY = cy(outcomeRows[o.next]);
        parts.push(`<path class="edge ${on ? "on" : ""}" d="M ${x1 + boxW} ${fromY} C ${x1 + boxW + 40} ${fromY}, ${x2 - 40} ${toY}, ${x2} ${toY}"/>`);
      } else if (rows[o.next] !== undefined) {
        const toY = cy(rows[o.next]);
        const bend = x1 + boxW / 2;
        parts.push(`<path class="edge ${on ? "on" : ""}" d="M ${bend} ${fromY + boxH / 2} L ${bend} ${toY - boxH / 2}"/>`);
      } else if (o.next === "RESULT") {
        parts.push(`<path class="edge ${on ? "on" : ""}" d="M ${x1 + boxW / 2} ${fromY + boxH / 2} L ${x1 + boxW / 2} ${h - 6}"/>`);
      }
    });
  });
  /* boxes */
  qNodes.forEach(id => {
    const on = taken.has(id);
    const y = pad + rows[id] * rowH;
    parts.push(`<g><rect class="box ${on ? "on" : ""}" x="${x1}" y="${y}" width="${boxW}" height="${boxH}" rx="8"/>
      <text class="lbl" x="${x1 + 12}" y="${y + 17}">${esc(id.split("_")[0])} — ${esc(shortQ(id))}</text>
      <text x="${x1 + 12}" y="${y + 31}">${esc(TREE.nodes[id].articleRef || "").slice(0, 44)}</text></g>`);
  });
  Object.entries(outcomeRows).forEach(([oid, r]) => {
    const oc = TREE.outcomes[oid];
    const on = E.state.flags.primaryTier === oid;
    const y = pad + r * rowH;
    parts.push(`<g><rect class="box outcome ${on ? "on" : ""}" x="${x2}" y="${y}" width="${boxW}" height="${boxH}" rx="8" style="stroke: var(--c-${oc.color})"/>
      <text class="lbl" x="${x2 + 12}" y="${y + 24}">${esc(shortOf(oc))}</text></g>`);
  });

  return `<svg class="map" viewBox="0 0 ${x2 + boxW + 10} ${h}" width="${x2 + boxW + 10}" height="${h}" role="img"
    aria-label="${esc(t("result.mapAria"))}">${parts.join("")}</svg>
    <p style="font-size:.85rem;color:var(--text-muted);margin-top:8px">${esc(t("result.mapCaption"))}</p>`;
}
function shortQ(id) {
  const map = {
    S0_ai_system: "AI system?", S1_prohibited: "Prohibited practice?", S2_annex_i_product: "Annex I product?",
    S3_annex_i_tpca: "Third-party assessment?", S4_annex_iii_area: "Annex III use case?", S5_profiling: "Profiling?",
    S6_filter: "Art. 6(3) filter?", T0_transparency: "Art. 50 situation?", G0_gpai: "GPAI model?", G1_systemic: "Systemic risk?"
  };
  return map[id] || id;
}

/* ---------- markdown summary download (no server, no library) ---------- */
function downloadSummary(heading, cards, triggered) {
  const m = TREE.meta, st = E.state;
  const L = [];
  L.push(`# ${t("export.title", { title: m.title })}`, "");
  L.push(`**${t("export.outcome")}:** ${heading}`, "");
  L.push(`- ${t("export.toolVersion")}: ${m.version} (${m.lastUpdated})`);
  L.push(`- ${t("export.regulation")}: ${m.regulation}`);
  L.push(`- ${t("export.generated")}: ${new Date().toISOString().slice(0, 16).replace("T", " ")} (${t("export.generatedNote")})`, "");
  L.push(`## ${t("export.cardsTitle")}`, "");
  for (const c of cards) {
    L.push(`### ${c.title}`, "", c.summary, "");
    if (c.id === "TRANSPARENCY" && triggered.length) {
      L.push(`**${t("result.triggered")}**`, "");
      triggered.forEach(item => L.push(`- ${item.ref} — ${item.label} → ${item.obligation || ""}`));
      L.push("");
    }
    if ((c.obligations || []).length) { L.push(`**${t("result.obligationsLabel")}**`, ""); c.obligations.forEach(o => L.push(`- ${o}`)); L.push(""); }
    if (c.applicationDate) L.push(`**${t("result.applicationDate")}** ${c.applicationDate}`, "");
    if ((c.legalRefs || []).length) L.push(`**${t("export.legalRefs")}:** ${c.legalRefs.join(", ")}`, "");
  }
  if (st.review.length) {
    L.push(`## ${t("export.reviewTitle")}`, "");
    st.review.forEach(r => L.push(`- **${r.question}** (${r.articleRef}) — ${r.note}`));
    L.push("");
  }
  L.push(`## ${t("export.trailTitle")}`, "");
  st.answers.forEach((a, i) => {
    L.push(`${i + 1}. **${a.question}** (${a.articleRef})`);
    L.push(`   - ${t("export.answer")}: ${a.answerLabel}`);
    if (a.sub) L.push(`   - ${a.sub.text} ${a.sub.label}`);
    a.selections.forEach(s => L.push(`   - ${t("export.selected")}: ${s.ref} — ${s.label}`));
    if (a.uncertain) L.push(`   - ${t("export.flagged")}`);
  });
  L.push("", `## ${t("export.disclaimerTitle")}`, "", m.disclaimer, "");
  L.push(`## ${t("export.sourcesTitle")}`, "");
  (m.sources || []).forEach(s => L.push(`- ${s}`));

  const blob = new Blob([L.join("\n")], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${t("export.filename")}-${new Date().toISOString().slice(0, 10)}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- orchestration ---------- */
function paint({ focus = false } = {}) {
  if (E.state.finished) { renderResult(); return; }
  $("#start").hidden = true;
  $("#result").hidden = true;
  $("#app").hidden = false;
  $("#btn-restart").hidden = false;
  renderStepper();
  renderVerdict();
  renderScreen();
  if (focus) {
    const h = $("#q-text");
    if (h) h.focus();
  }
}

function restart() {
  E.reset();
  prevVerdictLen = 0;
  $("#result").hidden = true;
  $("#app").hidden = true;
  $("#btn-restart").hidden = true;
  $("#start").hidden = false;
  window.scrollTo({ top: 0, behavior: "auto" });
  $("#btn-start").focus();
}

/* printing: expand every disclosure so nothing is silently missing from the PDF */
let reopenAfterPrint = [];
window.addEventListener("beforeprint", () => {
  reopenAfterPrint = [...document.querySelectorAll("details:not([open])")];
  reopenAfterPrint.forEach(d => { d.open = true; });
});
window.addEventListener("afterprint", () => {
  reopenAfterPrint.forEach(d => { d.open = false; });
  reopenAfterPrint = [];
});

/* edit-an-answer links live on the result screen */
document.addEventListener("click", (ev) => {
  const btn = ev.target.closest("[data-edit]");
  if (!btn || !E) return;
  E.editFrom(btn.dataset.edit);
  paint({ focus: true });
});

(async function init() {
  const { tree, sourceKey, sourceFile, errors } = await loadTree();
  const own = validateTree(tree);
  TREE = tree;
  UI = tree.ui || {};
  if (own.length) { showDataErrors(t("error.contract"), own); return; }
  if (errors && errors.length) showDataErrors(t("error.externalIgnored"), errors);

  E = createEngine(TREE);
  renderStart();
  $("#foot-source-of-data").textContent = t("chrome.dataSource", { source: t(sourceKey, { file: sourceFile }) });
  document.documentElement.lang = TREE.meta.language || "en";
  $("#btn-start").onclick = () => paint({ focus: true });
  $("#btn-restart").onclick = restart;

  /* exposed for test-scenarios.mjs and for console debugging */
  window.AIAct = { get tree() { return TREE; }, get engine() { return E; }, createEngine, validateTree };
})();
</script>
