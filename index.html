<script>
"use strict";

/* =========================================================================
   0. Helpers
   ========================================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

/* ---- interface strings: all of them come from ui.json → ui (or a "ui" block
   inside decision-tree.json, which wins). A missing key renders as ⟨key⟩ so a
   translation gap is visible but never fatal. */
let UI = {};
const interpolate = (s, vars) => String(s).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? String(vars[k]) : m));
function t(key, vars) {
  const s = UI[key];
  if (s == null) return `⟨${key}⟩`;
  return Array.isArray(s) ? s : interpolate(s, vars);
}
/* singular/plural pairs are stored as key.one / key.many */
const tn = (base, n) => t(`${base}.${n === 1 ? "one" : "many"}`, { n });

/* Lucide 0.460.0 — the icon set FARI's design system substitutes for its own
   (see the DS readme §4 and SPEC §11). Paths are inlined: the Lucide CDN script is
   deliberately not loaded, so the file stays self-contained and cannot fail to render.
   The five marked (*) are copied verbatim from theme-preview.html. */
const ICONS = {
  "circle-slash": '<circle cx="12" cy="12" r="10"/><line x1="9" x2="15" y1="15" y2="9"/>',
  ban:            '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
  warning:        '<path d="m10.29 3.86-8.47 14.14A2 2 0 0 0 3.53 21h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',   /* (*) triangle-alert */
  filter:         '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
  check:          '<path d="M20 6 9 17l-5-5"/>',
  eye:            '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',   /* (*) */
  cube:           '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  plus:           '<path d="M5 12h14"/><path d="M12 5v14"/>',
  dots:           '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  question:       '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  calendar:       '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  arrowRight:     '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  external:       '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',   /* (*) external-link */
  info:           '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  book:           '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',   /* (*) book-open */
  bulb:           '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>',   /* (*) lightbulb */
  people:         '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  build:          '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  lock:           '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  restart:        '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  shield:         '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>'
};
function icon(name, cls = "") {
  const d = ICONS[name] || ICONS.info;
  return `<svg class="ico${cls ? " " + cls : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
}
const toneStyle = (color) => {
  const c = color || "grey";
  return `--tone: var(--tier-${c}-accent); --tone-bg: var(--tier-${c}-bg); --tone-fg: var(--tier-${c}-fg);`;
};

/* Dates in the data are ISO ("2025-02-02"), sometimes inside a sentence
   ("originally 2026-08-02, postponed … to 2027-12-02"). Rewrite every ISO date it
   finds into day-month-year prose, using the locale from ui.json (an EU tool must
   not print "August 2, 2026"). */
let LOCALE = "en-GB";
function niceDate(v) {
  const s = String(v == null ? "" : v);
  return s.replace(/(\d{4})-(\d{2})-(\d{2})/g, (full, y, mo, d) => {
    try {
      return new Intl.DateTimeFormat(LOCALE, { day: "numeric", month: "long", year: "numeric" })
        .format(new Date(Number(y), Number(mo) - 1, Number(d)));
    } catch (_) { return full; }
  });
}
const isBareDate = (v) => /^\d{4}-\d{2}-\d{2}$/.test(String(v || "").trim());
const sentenceCase = (s) => String(s).charAt(0).toUpperCase() + String(s).slice(1);

/* =========================================================================
   1. ENGINE — pure logic, no DOM, driven entirely by the two JSON files.
      Kept between the markers below so test-scenarios.mjs runs the very same
      code that ships in the page.
   ========================================================================= */
/* ===== ENGINE START ===== */
function validateTree(tree, presentation) {
  const errors = [];
  for (const k of ["meta", "resultModel", "moduleOrder", "nodes", "outcomes", "catalog"]) {
    if (!tree || !tree[k]) errors.push(`missing top-level key "${k}"`);
  }
  if (errors.length) return errors;

  const guides = tree.guidelines || {};
  const notes = tree.notes || {};
  const ruleIds = new Set((tree.crossLinks && tree.crossLinks.rules || []).map(r => r.id));
  const knownRules = new Set(["biometrics-to-transparency", "biometrics-emotion-prohibition-reminder", "deepfake-implies-synthetic"]);
  const transparencyIds = new Set(((tree.catalog.transparencyTriggers || {}).items || []).map(i => i.id));
  const isTarget = (id) => Object.hasOwn(tree.nodes, id) || Object.hasOwn(tree.outcomes, id);
  const checkGuidelineLinks = (where, keys) => {
    for (const key of keys || []) {
      if (!Object.hasOwn(guides, key) && !Object.hasOwn(notes, key)) {
        errors.push(`${where}: guidelineLinks key "${key}" is in neither guidelines nor notes`);
      }
    }
  };

  for (const [id, node] of Object.entries(tree.nodes)) {
    if (!node.module) errors.push(`node ${id}: missing "module"`);
    if (!node.type) errors.push(`node ${id}: missing "type"`);
    checkGuidelineLinks(`node ${id}`, node.guidelineLinks);

    if (node.type === "context") {
      if (!isTarget(node.next)) errors.push(`node ${id}: "next" points at unknown target "${node.next}"`);
      if (!Array.isArray(node.fields) || !node.fields.length) errors.push(`node ${id}: context node without fields`);
      for (const f of node.fields || []) {
        if (!f.id || !f.setsFlag) errors.push(`node ${id}: field without "id"/"setsFlag"`);
        if (!Array.isArray(f.options) || !f.options.length) errors.push(`node ${id}: field "${f.id}" has no options`);
      }
      continue;
    }
    if (node.type !== "question") continue;

    if (!Array.isArray(node.options) || !node.options.length) errors.push(`node ${id}: no options`);
    for (const o of node.options || []) {
      if (!o.value) errors.push(`node ${id}: option without "value"`);
      if (!isTarget(o.next)) errors.push(`node ${id}: option "${o.value}" points at unknown target "${o.next}"`);
      if (o.flagsReview && !o.reviewNote) errors.push(`node ${id}: option "${o.value}" flags a review without a reviewNote`);
    }
    if (node.checklist && !tree.catalog[node.checklist]) errors.push(`node ${id}: unknown checklist "${node.checklist}"`);
    if (node.reference && !tree.catalog[node.reference]) errors.push(`node ${id}: unknown reference "${node.reference}"`);
    if (node.prefillFrom) {
      const ref = String(node.prefillFrom).split(":");
      if (ref[0] !== "crossLinks" || !ruleIds.has(ref[1])) errors.push(`node ${id}: prefillFrom "${node.prefillFrom}" does not name a crossLinks rule`);
    }
  }
  if (!tree.nodes.RESULT) errors.push('missing the "RESULT" node');

  for (const [id, oc] of Object.entries(tree.outcomes)) {
    for (const k of ["tier", "color", "title", "summary"]) if (!oc[k]) errors.push(`outcome ${id}: missing "${k}"`);
    for (const ob of oc.obligations || []) {
      if (!ob || typeof ob !== "object" || !ob.text) errors.push(`outcome ${id}: obligation must be {role, text}`);
      else if (!["provider", "deployer", "both"].includes(ob.role)) errors.push(`outcome ${id}: obligation role "${ob.role}" is not provider/deployer/both`);
    }
    checkGuidelineLinks(`outcome ${id}`, oc.guidelineLinks);
    for (const n of oc.showNotes || []) if (!Object.hasOwn(notes, n)) errors.push(`outcome ${id}: showNotes "${n}" is not in notes`);
    if (presentation && !presentation[oc.tier]) errors.push(`outcome ${id}: no presentation entry for tier "${oc.tier}" in ui.json`);
  }

  /* cross-link integrity: rules the code knows about, and item ids they point at */
  for (const r of (tree.crossLinks && tree.crossLinks.rules) || []) {
    if (!knownRules.has(r.id)) errors.push(`crossLinks: rule "${r.id}" has no handler in the engine`);
  }
  for (const area of ((tree.catalog.annexIII || {}).areas) || []) {
    for (const uc of area.useCases || []) {
      for (const id of uc.impliesTransparency || []) {
        if (!transparencyIds.has(id)) errors.push(`Annex III ${uc.ref}: impliesTransparency "${id}" is not a transparency trigger`);
      }
    }
  }
  return errors;
}

function createEngine(tree, opts = {}) {
  const outcomeIds = new Set(Object.keys(tree.outcomes));
  const presentation = opts.presentation || {};
  const phaseDefs = opts.phases || null;

  /* local string lookup, so the engine never depends on the UI layer */
  const strings = opts.ui || {};
  const tt = (key, vars) => {
    const s = strings[key];
    if (s == null) return `⟨${key}⟩`;
    return String(s).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? String(vars[k]) : m));
  };
  const ttn = (base, n) => tt(`${base}.${n === 1 ? "one" : "many"}`, { n });
  const pres = (oc) => presentation[oc && oc.tier] || {};
  const shortOf = (oc) => pres(oc).shortTitle || String((oc && oc.title) || "").split(/[:–]/)[0].trim();

  const freshState = () => ({
    currentNodeId: "S0_ai_system",
    answers: [],
    flags: {
      primaryTier: null,
      transparency: [],        // all triggered Art. 50 item ids
      transparencyAuto: [],    // the subset derived via crossLinks, shown locked in T0
      gpai: "none",
      role: "unknown",         // C0 – never changes the tier
      fossLicence: "unknown",  // C0 – never changes the tier
      reviewFlags: []          // {node, question, answer, note} from "I'm not sure"
    },
    reminders: [],             // crossLink rule ids to surface
    finished: false
  });

  let state = freshState();
  let stack = [];
  const memory = {};
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const node = (id) => tree.nodes[id];

  /* Where the flow goes once the spine reaches a tier (SPEC §7). The JSON cannot
     express this, so it lives here — in one place, used by both submit() and the
     decision map, so the two can never disagree. null means "stop". */
  function nextAfterOutcome(outcomeId) {
    if (outcomeId === "OUT_OF_SCOPE") return null;
    return outcomeId === "PROHIBITED" ? "G0_gpai" : "T0_transparency";  // banned skips transparency
  }
  const outcomeWithTier = (tier) =>
    Object.keys(tree.outcomes).find(id => tree.outcomes[id].tier === tier) || null;
  const transparencyCollector = () =>
    Object.keys(tree.nodes).find(id => tree.nodes[id].setsFlag === "transparency") || null;
  const resultNodeId = () =>
    Object.keys(tree.nodes).find(id => tree.nodes[id].type === "result") || null;

  /* flatten a catalog (flat items, or Annex III areas) and resolve ticked ids */
  function catalogItems(n) {
    const cat = tree.catalog[n.checklist] || tree.catalog[n.reference];
    if (!cat) return [];
    if (cat.items) return cat.items;
    return (cat.areas || []).flatMap(a => (a.useCases || []).map(u => ({ ...u, id: u.ref, area: a.area })));
  }
  function selectedItems(n, ids) {
    if (!n || !ids || !ids.length) return [];
    const flat = catalogItems(n);
    return ids.map(id => flat.find(i => i.id === id || i.ref === id)).filter(Boolean);
  }

  /* ---- cross-links (decision-tree.json → crossLinks.rules) ----
     Each rule id below has a handler here; validateTree fails on a rule with none,
     so a new rule can never be silently ignored. */
  function applyCrossLinks(n, items) {
    const rules = (tree.crossLinks && tree.crossLinks.rules) || [];
    const has = (id) => rules.some(r => r.id === id);

    if (has("biometrics-to-transparency")) {
      const implied = items.flatMap(i => i.impliesTransparency || []);
      for (const id of implied) {
        if (!state.flags.transparencyAuto.includes(id)) state.flags.transparencyAuto.push(id);
        if (!state.flags.transparency.includes(id)) state.flags.transparency.push(id);
      }
    }
    if (has("biometrics-emotion-prohibition-reminder")) {
      const inPlay = items.some(i => (i.impliesTransparency || []).includes("50-3") || i.crossLink === "biometrics-emotion-prohibition-reminder");
      if (inPlay && !state.reminders.includes("biometrics-emotion-prohibition-reminder")) {
        state.reminders.push("biometrics-emotion-prohibition-reminder");
      }
    }
    if (has("deepfake-implies-synthetic") && n.setsFlag === "transparency") {
      const ids = state.flags.transparency;
      if (ids.includes("50-4") && !ids.includes("50-2") && !state.reminders.includes("deepfake-implies-synthetic")) {
        state.reminders.push("deepfake-implies-synthetic");
      }
    }
  }

  function submit(input = {}) {
    const n = node(state.currentNodeId);
    if (!n || state.finished || !["question", "context"].includes(n.type)) return state;

    stack.push({ state: clone(state) });
    memory[state.currentNodeId] = clone(input);

    /* ---------- context node (C0): two optional fields, no branching ---------- */
    if (n.type === "context") {
      const chosen = {};
      for (const f of n.fields) {
        const value = input.skip ? "unknown" : ((input.fields || {})[f.id] || "unknown");
        state.flags[f.setsFlag] = value;
        const opt = (f.options || []).find(o => o.value === value);
        chosen[f.id] = { label: f.label, value, optionLabel: opt ? opt.label : value };
      }
      state.answers.push({
        nodeId: state.currentNodeId, module: n.module, type: "context",
        question: n.text, articleRef: "", value: input.skip ? "skipped" : "answered",
        answerLabel: input.skip
          ? tt("context.skipped")
          : Object.values(chosen).map(c => c.optionLabel).join(" · "),
        fields: chosen, selections: [], uncertain: false, sub: null
      });
      state.currentNodeId = n.next;
      return state;
    }

    /* ---------- question node ---------- */
    const option = n.options.find(o => o.value === input.value);
    if (!option) { stack.pop(); return state; }

    const items = selectedItems(n, input.selections);

    if (option.flagsReview) {
      state.flags.reviewFlags.push({
        node: state.currentNodeId, question: n.text, answer: option.label,
        articleRef: n.articleRef || "", note: option.reviewNote || ""
      });
    }
    if (option.setsGpai) state.flags.gpai = option.setsGpai;
    if (n.setsFlag === "transparency") {
      /* auto-derived items stay in, whatever the user ticked */
      const merged = [...state.flags.transparencyAuto, ...(input.selections || [])];
      state.flags.transparency = [...new Set(merged)];
    }
    applyCrossLinks(n, items);

    state.answers.push({
      nodeId: state.currentNodeId, module: n.module, type: "question",
      question: n.text, articleRef: n.articleRef || "",
      value: option.value, answerLabel: option.label,
      uncertain: !!option.flagsReview,
      selections: (n.setsFlag === "transparency" ? selectedItems(n, state.flags.transparency) : items)
        .map(i => ({
          ref: i.ref, plain: i.plain || i.label, label: i.label, area: i.area || null,
          obligation: i.obligation || null, role: i.role || null,
          auto: n.setsFlag === "transparency" && state.flags.transparencyAuto.includes(i.id)
        })),
      sub: null
    });

    let next = option.next;
    if (outcomeIds.has(next)) {
      state.flags.primaryTier = next;
      const after = nextAfterOutcome(next);
      if (after === null) { state.currentNodeId = "RESULT"; state.finished = true; return state; }
      next = after;
    }
    state.currentNodeId = next;
    if (next === "RESULT" || node(next).type === "result") {
      if (!state.flags.primaryTier) state.flags.primaryTier = "MINIMAL_RISK";
      state.finished = true;
    }
    return state;
  }

  function back() {
    const prev = stack.pop();
    if (prev) state = prev.state;
    return state;
  }
  function editFrom(nodeId) {
    const idx = stack.findIndex(s => s.state.currentNodeId === nodeId);
    if (idx === -1) return state;
    state = stack[idx].state;
    stack = stack.slice(0, idx);
    return state;
  }

  function compileCards() {
    const f = state.flags;
    const cards = [];
    if (f.primaryTier) cards.push({ id: f.primaryTier, ...tree.outcomes[f.primaryTier], role: "primary" });
    const tier = f.primaryTier ? tree.outcomes[f.primaryTier].tier : null;
    if (f.transparency.length && !["out_of_scope", "prohibited"].includes(tier)) {
      cards.push({ id: "TRANSPARENCY", ...tree.outcomes.TRANSPARENCY, role: "overlay" });
    }
    if (f.gpai !== "none") {
      const id = f.gpai === "gpai_model_systemic" ? "GPAI_MODEL_SYSTEMIC" : "GPAI_MODEL";
      cards.push({ id, ...tree.outcomes[id], role: "overlay" });
    }
    return cards;
  }

  /* obligations grouped and filtered by flags.role (SPEC §5.4) */
  function groupObligations(card, { allRoles = false } = {}) {
    const role = state.flags.role;
    const wanted = allRoles || role === "both" || role === "unknown"
      ? ["both", "provider", "deployer"]
      : ["both", role];
    const groups = [];
    for (const key of ["both", "provider", "deployer"]) {
      if (!wanted.includes(key)) continue;
      const items = (card.obligations || []).filter(o => o.role === key);
      if (items.length) groups.push({ role: key, items });
    }
    return groups;
  }
  /* is anything hidden right now? drives the "show all roles" toggle */
  function hasHiddenObligations(cards) {
    if (["both", "unknown"].includes(state.flags.role)) return false;
    return cards.some(c => (c.obligations || []).some(o => o.role !== "both" && o.role !== state.flags.role));
  }

  /* which notes to show on a card: its own showNotes, the FOSS note when the user
     said open-source, and the FOSS note on every GPAI card (SPEC §5.4) */
  function notesFor(card) {
    const keys = [...(card.showNotes || [])];
    const add = (k) => { if (!keys.includes(k)) keys.push(k); };
    if (String(card.tier).startsWith("gpai_model")) add("fossExemption");
    /* the user told us it is open-source: say it once, on the card that carries the
       tier, rather than repeating the same panel under every card */
    if (state.flags.fossLicence === "yes" && card.role === "primary") add("fossExemption");
    return keys.filter(k => (tree.notes || {})[k]);
  }

  function phases() {
    const byModule = (m) => Object.entries(tree.nodes)
      .filter(([, n]) => n.module === m && n.type !== "result").map(([id]) => id);
    let defs = (phaseDefs || (tree.moduleOrder || []).filter(m => m !== "RESULT")
      .map(m => ({ id: m, label: m, module: m, nodes: byModule(m) })))
      .map(p => ({ ...p, nodes: [...p.nodes] }));

    /* self-healing: a node the phase list does not mention (e.g. added to the tree
       later) joins the first phase of its module, so the stepper never goes blank */
    for (const [id, n] of Object.entries(tree.nodes)) {
      if (n.type === "result" || defs.some(p => p.nodes.includes(id))) continue;
      const target = defs.find(p => p.module === n.module) || defs[defs.length - 1];
      if (target) target.nodes.push(id);
    }

    const answered = new Set(state.answers.map(a => a.nodeId));
    const currentIdx = defs.findIndex(p => p.nodes.includes(state.currentNodeId));
    return defs.map((p, i) => {
      const visited = p.nodes.some(id => answered.has(id));
      let st;
      if (!state.finished && i === currentIdx) st = "current";
      else if (visited) st = "done";
      else if (state.finished || (currentIdx > -1 && i < currentIdx)) st = "skipped";
      else st = "upcoming";
      return { ...p, state: st };
    });
  }

  /* ---- decision map ----------------------------------------------------
     The graph the map is drawn from. It lives in the engine because it encodes
     routing, not looks: four result cards (minimal risk, the transparency overlay
     and the two GPAI cards) are never an option's `next` — the engine derives them
     from the accumulated flags, and without these arrows they would sit on the map
     unexplained. render-decision-tree.py builds the same model in Python for the
     static diagram in diagram/; keep the two in step. */
  function mapGraph() {
    const nodes = [], edges = [];
    const addEdge = (src, dst, label, short, style) => {
      if (!src || !dst || !(src in tree.nodes || src in tree.outcomes)) return;
      if (!(dst in tree.nodes || dst in tree.outcomes)) return;
      edges.push({ src, dst, label, short, style });
    };

    for (const [id, n] of Object.entries(tree.nodes)) {
      const kind = n.type || "question";
      const cat = tree.catalog[n.checklist] || tree.catalog[n.reference];
      const count = cat ? (cat.items ? cat.items.length
        : (cat.areas || []).reduce((sum, a) => sum + (a.useCases || []).length, 0)) : 0;
      const sub = [
        (n.legalText || {}).articleRef || n.articleRef,
        count ? `${count} items` : "",
        n.optional ? "optional" : ""
      ].filter(Boolean).join(" · ");
      nodes.push({ key: id, kind, title: kind === "result" ? tt("result.pathResultLabel") : n.text, sub });
    }
    for (const [id, oc] of Object.entries(tree.outcomes)) {
      nodes.push({ key: id, kind: "outcome", title: shortOf(oc),
        sub: (oc.legalRefs || []).slice(0, 2).join(" · "), color: oc.color, icon: pres(oc).icon });
    }

    for (const [id, n] of Object.entries(tree.nodes)) {
      if ((n.type || "question") === "context") {
        addEdge(id, n.next, tt("context.saveContinue"), tt("question.continue").toLowerCase(), "answer");
        continue;
      }
      for (const o of n.options || []) {
        const unsure = !!o.flagsReview;
        addEdge(id, o.next, o.label, unsure ? tt("map.notSure") : String(o.value), unsure ? "unsure" : "answer");
        if (o.setsGpai) {
          addEdge(id, outcomeWithTier(o.setsGpai), o.label, tt("map.addsCard"), "engine");
        }
      }
    }
    for (const id of Object.keys(tree.outcomes)) {
      const after = nextAfterOutcome(id);
      if (after) addEdge(id, after, tt("map.thenLong"), tt("map.then"), "engine");
    }
    addEdge(transparencyCollector(), outcomeWithTier("transparency"),
      tt("map.ifAnyItemLong"), tt("map.ifAnyItem"), "engine");
    addEdge(resultNodeId(), outcomeWithTier("minimal_risk"),
      tt("map.noTierLong"), tt("map.noTier"), "engine");

    /* cross-links: found in the data, not assumed */
    const rules = (tree.crossLinks || {}).rules || [];
    if (rules.some(r => r.id === "biometrics-to-transparency")) {
      const collector = transparencyCollector();
      for (const [id, n] of Object.entries(tree.nodes)) {
        const cat = tree.catalog[n.reference] || tree.catalog[n.checklist];
        const implied = ((cat || {}).areas || []).flatMap(a =>
          (a.useCases || []).flatMap(u => u.impliesTransparency || []));
        if (implied.length && collector && collector !== id) {
          const ids = [...new Set(implied)];
          addEdge(id, collector, tt("map.autoDerivesLong", { items: ids.join(", ") }),
            tt("map.autoDerives", { items: ids.join(", ") }), "crosslink");
        }
      }
    }

    /* order: by phase, then by distance from the start (depth alone interleaves the
       phases, because T0 and G0 are reachable earlier than the last tier question) */
    const flowEdges = edges.filter(e => ["answer", "unsure", "engine"].includes(e.style));
    const outOf = {};
    for (const e of flowEdges) (outOf[e.src] = outOf[e.src] || []).push(e.dst);
    const start = tree.nodes.S0_ai_system ? "S0_ai_system" : Object.keys(tree.nodes)[0];
    const depth = { [start]: 0 };
    const queue = [start];
    while (queue.length) {
      const cur = queue.shift();
      for (const nxt of outOf[cur] || []) {
        if (!(nxt in depth)) { depth[nxt] = depth[cur] + 1; queue.push(nxt); }
      }
    }
    const maxDepth = Math.max(0, ...Object.values(depth));
    const phaseIndex = {};
    (phaseDefs || []).forEach((p, i) => (p.nodes || []).forEach(k => { phaseIndex[k] = i; }));
    const lastPhase = (phaseDefs || []).length;

    const flow = nodes.filter(n => n.kind !== "outcome").sort((a, b) =>
      (phaseIndex[a.key] ?? lastPhase) - (phaseIndex[b.key] ?? lastPhase)
      || (depth[a.key] ?? maxDepth + 1) - (depth[b.key] ?? maxDepth + 1)
      || a.key.localeCompare(b.key));
    flow.forEach((n, i) => { n.col = 0; n.row = i; });

    /* each result card sits beside the earliest box that can produce it */
    const rowOf = {};
    flow.forEach(n => { rowOf[n.key] = n.row; });
    const taken = new Set();
    for (const card of nodes.filter(n => n.kind === "outcome")
      .sort((a, b) => (depth[a.key] ?? 99) - (depth[b.key] ?? 99))) {
      const sources = edges.filter(e => e.dst === card.key && e.src in rowOf).map(e => rowOf[e.src]);
      let row = sources.length ? Math.min(...sources) : 0;
      while (taken.has(row)) row += 1;
      taken.add(row);
      card.col = 1; card.row = row;
    }
    return { nodes, edges, phases: phaseDefs || [] };
  }

  /* which boxes and arrows the user actually went through */
  function pathTaken() {
    const nodeKeys = new Set(state.answers.map(a => a.nodeId));
    const edgeKeys = new Set();
    for (const a of state.answers) {
      const n = node(a.nodeId);
      if (!n) continue;
      let target = null;
      if ((n.type || "question") === "context") target = n.next;
      else {
        const opt = (n.options || []).find(o => o.value === a.value);
        target = opt ? opt.next : null;
        if (opt && opt.setsGpai) {
          const card = outcomeWithTier(opt.setsGpai);
          if (card) { edgeKeys.add(`${a.nodeId}>${card}`); nodeKeys.add(card); }
        }
      }
      if (!target) continue;
      edgeKeys.add(`${a.nodeId}>${target}`);
      if (tree.outcomes[target]) {
        nodeKeys.add(target);
        const after = nextAfterOutcome(target);
        if (after) edgeKeys.add(`${target}>${after}`);
      }
    }
    if (state.finished) {
      const cards = compileCards().map(c => c.id);
      cards.forEach(id => nodeKeys.add(id));
      if (cards.includes("TRANSPARENCY")) {
        const c = transparencyCollector();
        if (c) edgeKeys.add(`${c}>${outcomeWithTier("transparency")}`);
      }
      if (state.flags.primaryTier === "MINIMAL_RISK") {
        nodeKeys.add(resultNodeId());
        edgeKeys.add(`${resultNodeId()}>${outcomeWithTier("minimal_risk")}`);
      }
    }
    return { nodes: nodeKeys, edges: edgeKeys };
  }

  function verdict() {
    const lines = [];
    const byNode = {};
    for (const a of state.answers) byNode[a.nodeId] = a;
    const f = state.flags;

    if (byNode.S0_ai_system) {
      const a = byNode.S0_ai_system;
      lines.push(a.value === "yes"
        ? { icon: "check", color: "green", text: tt("verdict.isAiSystem"), sub: "Art. 3(1)" }
        : a.value === "unsure"
          ? { icon: "question", color: "yellow", text: tt("verdict.aiSystemUnclear"), sub: tt("verdict.conservativeSub") }
          : { icon: "circle-slash", color: "grey", text: tt("verdict.notAiSystem"), sub: "Art. 3(1)" });
    }
    if (byNode.C0_context) {
      if (["provider", "deployer", "both"].includes(f.role)) {
        lines.push({ icon: "people", color: null, text: tt(`verdict.role.${f.role}`), sub: tt("verdict.contextSub") });
      }
      if (f.fossLicence === "yes") {
        lines.push({ icon: "build", color: null, text: tt("verdict.foss"), sub: tt("verdict.contextSub") });
      }
    }
    if (byNode.S1_prohibited) {
      lines.push(byNode.S1_prohibited.value === "yes"
        ? { icon: "ban", color: "red", text: tt("verdict.prohibitedFound"), sub: "Art. 5" }
        : { icon: "check", color: "green", text: tt("verdict.noProhibited"), sub: "Art. 5" });
    }

    const tierId = f.primaryTier;
    const tierResolved = tierId && !["OUT_OF_SCOPE", "PROHIBITED"].includes(tierId);
    const inTier = ["S2_annex_i_product", "S3_annex_i_tpca", "S4_annex_iii_area", "S5_profiling", "S6_filter"]
      .some(id => byNode[id]);
    if (tierResolved) {
      const oc = tree.outcomes[tierId];
      lines.push({ icon: pres(oc).icon, color: oc.color, text: shortOf(oc), sub: (oc.legalRefs || [])[0] || "" });
    } else if (inTier && !state.finished) {
      lines.push({ icon: "dots", color: null, text: tt("verdict.assessingTier"), pending: true });
    } else if (state.finished && tierId === "MINIMAL_RISK") {
      const oc = tree.outcomes.MINIMAL_RISK;
      lines.push({ icon: pres(oc).icon, color: oc.color, text: shortOf(oc), sub: tt("verdict.minimalSub") });
    }

    if (byNode.T0_transparency) {
      const n = f.transparency.length;
      lines.push(n
        ? { icon: "plus", color: "blue", text: tt("verdict.transparencyAdded", { n }), sub: "Art. 50" }
        : { icon: "check", color: "green", text: tt("verdict.noTransparency"), sub: "Art. 50" });
    }
    if (byNode.G1_systemic || (byNode.G0_gpai && byNode.G0_gpai.value !== "yes")) {
      const card = f.gpai === "gpai_model_systemic" ? tree.outcomes.GPAI_MODEL_SYSTEMIC : tree.outcomes.GPAI_MODEL;
      lines.push(f.gpai === "none"
        ? { icon: "check", color: "green", text: tt("verdict.notGpai"), sub: "Art. 3(63)" }
        : { icon: pres(card).icon, color: card.color, text: shortOf(card), sub: (card.legalRefs || [])[0] || "" });
    }
    if (f.reviewFlags.length) {
      lines.push({ icon: "question", color: "yellow", text: ttn("verdict.reviewPoints", f.reviewFlags.length), sub: tt("verdict.reviewSub") });
    }
    return lines;
  }

  return {
    tree,
    get state() { return state; },
    get memory() { return memory; },
    canGoBack: () => stack.length > 0,
    currentNode: () => ({ id: state.currentNodeId, ...node(state.currentNodeId) }),
    submit, back, editFrom,
    compileCards, groupObligations, hasHiddenObligations, notesFor,
    phases, verdict, selectedItems, catalogItems, shortOf, pres,
    mapGraph, pathTaken, nextAfterOutcome,
    reset() { state = freshState(); stack = []; return state; }
  };
}
/* ===== ENGINE END ===== */

/* =========================================================================
   2. UI
   ========================================================================= */
let TREE = null, PRES = {}, PHASES = null, E = null, prevVerdictLen = 0, showAllRoles = false;

/* ---- data loading ---- */
async function fetchJson(file) {
  try {
    const res = await fetch(file, { cache: "no-cache" });
    if (res.ok) return await res.json();
  } catch (_) { /* file:// or not hosted alongside */ }
  return null;
}
async function loadData() {
  const lang = new URLSearchParams(location.search).get("lang");
  const suffix = lang && /^[a-z]{2}(-[a-z]{2})?$/i.test(lang) ? `.${lang.toLowerCase()}` : "";

  const uiEmbedded = JSON.parse($("#ui-data").textContent);
  const uiExternal = (suffix ? await fetchJson(`ui${suffix}.json`) : null) || await fetchJson("ui.json");
  const uiDoc = (uiExternal && uiExternal.ui) ? uiExternal : uiEmbedded;

  const presentation = uiDoc.presentation || {};
  const phases = uiDoc.phases || null;
  const baseUi = uiDoc.ui || {};
  LOCALE = uiDoc.locale || "en-GB";

  const candidates = [];
  if (suffix) candidates.push(`decision-tree${suffix}.json`);
  candidates.push("decision-tree.json");

  let errors = null, sourceFile = null, tree = null;
  for (const file of candidates) {
    const json = await fetchJson(file);
    if (!json) continue;
    const errs = validateTree(json, presentation);
    if (!errs.length) { tree = json; sourceFile = file; break; }
    errors = errors || errs;
  }
  if (!tree) tree = JSON.parse($("#decision-tree-data").textContent);

  return {
    tree, presentation, phases,
    ui: { ...baseUi, ...(tree.ui || {}) },     // a "ui" block inside the tree wins
    sourceKey: sourceFile ? "source.external" : (errors ? "source.embeddedFallback" : "source.embedded"),
    sourceFile, errors,
    uiSource: uiDoc === uiEmbedded ? t("source.embedded") : "ui.json"
  };
}

function showDataErrors(title, errors) {
  const el = $("#databanner");
  el.innerHTML = `<strong>${esc(title)}</strong><ul>${errors.slice(0, 12).map(e => `<li>${esc(e)}</li>`).join("")}</ul>`;
  el.style.display = "block";
}

/* ---- guideline links + notes (both can appear in guidelineLinks[]) ---- */
function guidanceBlock(keys) {
  const guides = TREE.guidelines || {}, notes = TREE.notes || {};
  const links = (keys || []).filter(k => guides[k]).map(k => {
    const g = guides[k];
    const draft = /draft/i.test(g.status || "");
    return `<a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">
      ${icon("external")}<span>${esc(g.title)}</span>
      ${draft ? `<span class="chip draft">${esc(t("question.guidanceDraft"))}</span>` : ""}
    </a>`;
  });
  const noteKeys = (keys || []).filter(k => !guides[k] && notes[k]);
  return {
    links: links.length ? `<div class="guidance"><span class="lbl">${esc(t("question.guidance"))}</span>${links.join("")}</div>` : "",
    notes: noteKeys.map(k => notePanel(k)).join("")
  };
}
function notePanel(key, cls = "") {
  const n = (TREE.notes || {})[key];
  if (!n) return "";
  return `<div class="info-panel ${cls}">
    <h4>${icon("info")}${esc(n.title)}</h4>
    <p>${esc(n.body)}</p>
    ${n.articleRef ? `<div class="refline"><span class="chip art">${esc(n.articleRef)}</span></div>` : ""}
  </div>`;
}
function reminderPanel(ruleId) {
  const rule = ((TREE.crossLinks || {}).rules || []).find(r => r.id === ruleId);
  if (!rule) return "";
  /* crossLinks[].then is written as an instruction to the implementer, so it must
     not be shown to the user. The reader-facing sentence lives in ui.json; fall back
     to `then` only if a rule has no ui text yet, so a new rule is never silent. */
  const uiText = UI[`crosslink.${ruleId}.text`];
  return `<div class="info-panel reminder">
    <h4>${icon("warning")}${esc(UI[`crosslink.${ruleId}.title`] || t("question.reminder"))}</h4>
    <p>${esc(uiText || rule.then)}</p>
    ${(rule.refs || []).length ? `<div class="refline">${rule.refs.map(r => `<span class="chip art">${esc(r)}</span>`).join(" ")}</div>` : ""}
  </div>`;
}

/* ---------- start screen ---------- */
function renderStart(sources) {
  const m = TREE.meta;
  $("#brand-title").textContent = m.title;
  $("#brand-sub").textContent = `${m.regulation} · v${m.version}`;
  document.title = m.title;
  document.documentElement.lang = m.language || "en";

  $("#start-eyebrow").textContent = t("brand.eyebrow");
  $("#start-h").textContent = t("start.headline");
  $("#foot-funding-en").textContent = t("funding.en");
  $("#foot-funding-nl").textContent = t("funding.nl");
  $("#foot-funding-fr").textContent = t("funding.fr");
  $("#foot-funding-link").textContent = t("funding.linkLabel");
  /* the logos are optional files; show the row only once one of them loads */
  const logos = [...document.querySelectorAll("[data-optional-logo]")];
  let shown = 0;
  logos.forEach(img => {
    img.addEventListener("load", () => { shown++; $("#foot-logos").hidden = false; });
    img.addEventListener("error", () => { img.remove(); });
  });
  $("#start-purpose").textContent = m.purpose;
  $("#start-disclaimer").innerHTML = `<strong>${esc(t("start.disclaimerLabel"))}</strong>${esc(m.disclaimer)}`;
  $("#start-legend").setAttribute("aria-label", t("start.legendLabel"));
  $("#progress-nav").setAttribute("aria-label", t("progress.label"));
  $("#verdict-h").textContent = t("verdict.title");
  $("#btn-restart-label").textContent = t("chrome.restart");
  $("#start-model-summary").textContent = t("start.modelSummary");
  $("#start-changelog-summary").textContent = t("start.changelogSummary");
  $("#start-map-summary").textContent = t("start.mapSummary");
  /* drawn on first open, not on load: it is a big SVG and most readers head straight
     into the questions. SPEC §5.1 keeps the full tree out of the assessment itself. */
  $("#start-map-toggle").addEventListener("toggle", (e) => {
    if (e.target.open && !$("#start-map-holder").innerHTML) {
      $("#start-map-holder").innerHTML = mapPanel({ highlight: false });
    }
  });
  $("#btn-start").innerHTML = `${esc(t("start.button"))}${icon("arrowRight")}`;
  $("#start-facts").innerHTML = [1, 2, 3].map(i =>
    `<div class="f"><b>${esc(t(`start.fact${i}.label`))}</b><span>${esc(t(`start.fact${i}.text`))}</span></div>`).join("");

  const order = ["OUT_OF_SCOPE", "PROHIBITED", "HIGH_RISK_ANNEX_I", "HIGH_RISK_ANNEX_III",
    "NOT_HIGH_RISK_FILTERED", "MINIMAL_RISK", "TRANSPARENCY", "GPAI_MODEL"];
  $("#start-legend").innerHTML = order.filter(id => TREE.outcomes[id]).map(id => {
    const oc = TREE.outcomes[id];

  }).join("");

  const rm = TREE.resultModel;
  $("#start-model").innerHTML = `
    <p>${esc(rm.description)}</p>
    <ul style="margin-top:10px; display:grid; gap:6px">

    </ul>
    <p style="margin-top:12px"><b>${esc(t("start.shortCircuitsLabel"))}</b></p>
    <ul style="display:grid; gap:6px">${(rm.shortCircuits || []).map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    ${(TREE.crossLinks && TREE.crossLinks.rules || []).length ? `<p style="margin-top:12px" class="note">${esc(TREE.crossLinks.description)}</p>` : ""}`;
  $("#start-changelog").innerHTML = `<ul style="display:grid; gap:8px">${(m.changelog || []).map(c => `<li>${esc(c)}</li>`).join("")}</ul>`;

  $("#foot-links").innerHTML = Object.values(TREE.guidelines || {})
    .filter(g => g && g.url)
    .slice(0, 3)
    .map(g => `<li><a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">${esc(g.title)}</a></li>`).join("")
    + `<li><a href="https://digital-strategy.ec.europa.eu/en/policies/ai-act-service-desk" target="_blank" rel="noopener noreferrer">AI Act Service Desk</a></li>`;
  $("#foot-sources").innerHTML = Object.values(TREE.guidelines || {})
    .filter(g => g && g.title)
    .map(g => `<li>${esc(g.title)}${/draft/i.test(g.status || "") ? ` <span class="chip draft">${esc(t("question.guidanceDraft"))}</span>` : ""}</li>`).join("");
  $("#foot-dates").innerHTML = Object.entries(m.keyDates || {}).map(([k, v]) =>
    `<li><b style="color:var(--text)">${esc(t(`footer.date.${k}`))}:</b> ${esc(niceDate(v))}</li>`).join("");
  $("#foot-h-help").textContent = t("footer.help");
  $("#foot-h-sources").textContent = t("footer.sources");
  $("#foot-h-dates").textContent = t("footer.dates");
  $("#foot-version").textContent = t("chrome.versionLine", { version: m.version, date: m.lastUpdated });
  $("#foot-regulation").textContent = m.regulation;
  $("#foot-source-of-data").textContent = t("chrome.dataSource", {
    files: `${t(sources.sourceKey, { file: sources.sourceFile })} + ${sources.uiSource}`
  });
}

/* ---------- progress ---------- */
function renderStepper() {
  const phases = E.phases();
  const words = {
    current: t("progress.state.current"), done: t("progress.state.done"),
    skipped: t("progress.state.skipped"), upcoming: t("progress.state.upcoming")
  };
  $("#stepper").innerHTML = phases.map((p) => `
    <li data-state="${p.state}" ${p.state === "current" ? 'aria-current="step"' : ""}>
      <div class="seg">
        <span class="bar"></span>
        <span class="lbl">${p.state === "done" ? icon("check") : ""}${esc(p.label)}</span>
        <span class="visually-hidden">: ${words[p.state]}</span>
      </div>
    </li>`).join("");
  const idx = phases.findIndex(p => p.state === "current");
  $("#stepper-mobile").textContent = idx > -1
    ? t("progress.mobile", { n: idx + 1, total: phases.length, label: phases[idx].label })
    : "";
}

function renderVerdict() {
  const lines = E.verdict();
  const body = $("#verdict-body");
  if (!lines.length) {
    body.innerHTML = `<p class="empty">${esc(t("verdict.empty"))}</p>`;
    prevVerdictLen = 0;
    return;
  }
  body.innerHTML = `<ul class="vlist">${lines.map((l, i) => `
    <li ${l.color ? `data-color="${l.color}" style="${toneStyle(l.color)}"` : ""} class="${l.pending ? "pending" : ""} ${i >= prevVerdictLen ? "new" : ""}">
      <span class="mk">${icon(l.icon)}</span>
      <span><span>${esc(l.text)}</span>${l.sub ? `<br><span class="sub">${esc(l.sub)}</span>` : ""}</span>
    </li>`).join("")}</ul>`;
  prevVerdictLen = lines.length;
}

/* ---------- checklist item: plain line visible, exact legal wording on expand ---------- */
function itemRow(item, { name, checked, locked }) {
  const id = `${name}__${String(item.id || item.ref).replace(/[^\w-]/g, "_")}`;
  const plain = item.plain || item.label;
  const showsExact = item.label && item.label !== plain;
  return `
  <div class="opt">
    <input type="checkbox" id="${esc(id)}" name="${esc(name)}" value="${esc(item.id || item.ref)}"
      ${checked ? "checked" : ""} ${locked ? "disabled" : ""}>
    <span class="txt">
      <label class="plain" for="${esc(id)}">${esc(plain)}</label>
      ${item.obligation ? `<span class="obl">${esc(t("question.obligationPrefix"))} ${esc(item.obligation)}</span>` : ""}
      ${item.example ? `<span class="example">${esc(t("question.examplePrefix"))} ${esc(item.example)}</span>` : ""}
      <span class="meta">
        ${item.ref ? `<span class="chip art">${esc(item.ref)}</span>` : ""}
        ${item.role ? `<span class="chip role">${esc(item.role === "provider" ? t("question.roleProvider") : t("question.roleDeployer"))}</span>` : ""}
        ${locked ? `<span class="chip auto">${icon("lock")} ${esc(t("question.autoDerived"))}</span>` : ""}
      </span>
      ${showsExact ? `<details class="exact"><summary>${esc(t("question.exactWording"))}</summary>
        <div class="exact-body">
          <span>${esc(item.label)}</span>
          ${item.detail ? `<span>${esc(item.detail)}</span>` : ""}
        </div></details>` : ""}
    </span>
  </div>`;
}

/* ---------- context screen (C0) ---------- */
function renderContext(n) {
  const mem = E.memory[n.id] || {};
  const g = guidanceBlock(n.guidelineLinks);
  const screen = $("#screen");
  screen.innerHTML = `
    <div class="q-head"><span class="chip">${esc(t("context.optional"))}</span></div>
    <h2 class="q-text" id="q-text" tabindex="-1">${esc(n.text)}</h2>
    <p class="q-explainer">${esc(n.explainer || "")}</p>
    ${g.links ? `<div class="panels">${g.links}</div>` : ""}
    <div class="ctx-fields">
      ${n.fields.map(f => `
        <div class="ctx-field">
          <label class="lbl" for="ctx-${esc(f.id)}">${esc(f.label)}</label>
          <select id="ctx-${esc(f.id)}" data-field="${esc(f.id)}">
            ${f.options.map(o => {
              const sel = ((mem.fields || {})[f.id] || "") === o.value;
              return `<option value="${esc(o.value)}" ${sel ? "selected" : ""}>${esc(o.label)}</option>`;
            }).join("")}
          </select>
          ${f.articleRef ? `<div class="refline"><span class="chip art">${esc(f.articleRef)}</span></div>` : ""}
        </div>`).join("")}
    </div>
    ${g.notes ? `<div class="panels">${g.notes}</div>` : ""}
    <div class="actions">
      <button class="btn primary" id="btn-continue">${esc(t("context.saveContinue"))} ${icon("arrowRight")}</button>
      <button class="btn ghost" id="btn-skip">${esc(t("context.skip"))}</button>
      ${E.canGoBack() ? `<button class="btn ghost" id="btn-back">${esc(t("question.back"))}</button>` : ""}
    </div>`;

  const readFields = () => {
    const fields = {};
    screen.querySelectorAll("select[data-field]").forEach(s => { fields[s.dataset.field] = s.value; });
    return fields;
  };
  $("#btn-continue", screen).onclick = () => { E.submit({ fields: readFields() }); paint({ focus: true }); };
  $("#btn-skip", screen).onclick = () => { E.submit({ skip: true }); paint({ focus: true }); };
  const back = $("#btn-back", screen);
  if (back) back.onclick = () => { E.back(); paint({ focus: true }); };
}

/* ---------- question screen ---------- */
function renderQuestion(n) {
  const mem = E.memory[n.id] || {};
  const auto = new Set(n.prefillFrom ? E.state.flags.transparencyAuto : []);
  const selection = new Set([...(mem.selections || []), ...auto]);
  const cat = n.checklist ? TREE.catalog[n.checklist] : null;
  const refCat = n.reference ? TREE.catalog[n.reference] : null;
  const grouped = refCat && refCat.areas ? refCat : null;
  const hasChecklist = !!(cat || grouped);
  const g = guidanceBlock(n.guidelineLinks);
  const parts = [];

  parts.push(`<div class="q-head">${n.articleRef ? `<span class="chip art">${esc(n.articleRef)}</span>` : ""}</div>
    <h2 class="q-text" id="q-text" tabindex="-1">${esc(n.text)}</h2>
    <p class="q-explainer">${esc(n.explainer || "")}</p>`);

  /* Layer 2 + 3 + reference panels, all collapsed by default */
  const panels = [];
  if (n.legalText && n.legalText.text) {
    panels.push(`<details class="disclosure legal"><summary>${icon("book")}${esc(t("question.legalSummary"))}${n.legalText.articleRef ? ` <span class="chip art">${esc(n.legalText.articleRef)}</span>` : ""}</summary>
      <div class="body"><blockquote>${esc(n.legalText.text)}</blockquote></div></details>`);
  }
  if (n.help && (n.help.likelyYes || n.help.likelyNo)) {
    panels.push(`<details class="disclosure"><summary>${icon("bulb")}${esc(t("question.helpSummary"))}</summary><div class="body">
      <div class="help-cols">
        ${n.help.likelyYes ? `<div><h4>${esc(t("question.likelyYes"))}</h4><ul>${n.help.likelyYes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
        ${n.help.likelyNo ? `<div><h4>${esc(t("question.likelyNo"))}</h4><ul>${n.help.likelyNo.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      </div></div></details>`);
  }
  if (refCat && !grouped) {
    panels.push(`<details class="disclosure"><summary>${esc(t("question.referenceSummary", { ref: refCat.articleRef || n.reference }))}</summary><div class="body">
      ${refCat.note ? `<p class="note" style="margin-bottom:12px">${esc(refCat.note)}</p>` : ""}
      <div class="help-cols">
        ${refCat.sectionA ? `<div><h4>${esc(t("question.sectionA"))}</h4><ul>${refCat.sectionA.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
        ${refCat.sectionB ? `<div><h4>${esc(t("question.sectionB"))}</h4><ul>${refCat.sectionB.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      </div></div></details>`);
  }
  if (grouped && grouped.horizontalNotes) {
    panels.push(`<details class="disclosure"><summary>${esc(t("question.annexIIINotes"))}</summary><div class="body">
      <ul>${grouped.horizontalNotes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></details>`);
  }
  if (g.links) panels.push(g.links);
  if (panels.length) parts.push(`<div class="panels">${panels.join("")}</div>`);

  /* checklists */
  if (cat) {
    const lockedIds = n.prefillFrom ? auto : new Set();
    parts.push(`<fieldset class="choices">
      <legend>${esc(t("question.checklistLegend"))}</legend>
      ${cat.note ? `<p class="note" style="margin-bottom:12px">${esc(cat.note)}</p>` : ""}
      ${lockedIds.size ? `<p class="note" style="margin-bottom:12px">${esc(t("question.autoDerivedLocked"))}</p>` : ""}
      ${cat.items.map(it => itemRow(it, { name: "sel", checked: selection.has(it.id), locked: lockedIds.has(it.id) })).join("")}
      ${cat.overrides ? `<div class="note" style="margin-top:10px"><b>${esc(t("question.overrides"))}</b><ul style="margin-top:4px">${cat.overrides.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>` : ""}
    </fieldset>`);
  }
  if (grouped) {
    parts.push(`<fieldset class="choices">
      <legend>${esc(t("question.annexIIILegend"))}</legend>
      ${grouped.areas.map(a => {
        const sel = (a.useCases || []).filter(u => selection.has(u.ref)).length;
        return `<details class="area ${sel ? "has-sel" : ""}" ${sel ? "open" : ""}>
          <summary><span class="chip">${esc(t("question.area", { n: a.id }))}</span> ${esc(a.area)}<span class="count" ${sel ? "" : "hidden"}>${esc(t("question.selectedCount", { n: sel }))}</span></summary>
          <div class="inner">
            ${a.condition ? `<p class="cond">${esc(a.condition)}</p>` : ""}
            ${(a.useCases || []).map(u => itemRow({ ...u, id: u.ref }, { name: "sel", checked: selection.has(u.ref) })).join("")}
          </div></details>`;
      }).join("")}
    </fieldset>`);
  }

  /* live hints: "counts as", cross-link reminders */
  parts.push(`<div class="hint" id="hint-counts" hidden></div>
    <div id="hint-crosslinks"></div>`);

  /* answers */
  parts.push(`<div class="btn-list" role="group" aria-labelledby="q-text">
      ${n.options.map((o, i) => `<button class="btn-opt" data-value="${esc(o.value)}" data-tone="${o.flagsReview ? "unsure" : "plain"}">
        <span class="mark">${o.flagsReview ? "?" : String.fromCharCode(65 + i)}</span>
        <span>${esc(o.label)}</span>
      </button>`).join("")}
    </div>
    <div class="actions">${E.canGoBack() ? `<button class="btn ghost" id="btn-back">${esc(t("question.back"))}</button>` : ""}</div>`);

  const screen = $("#screen");
  screen.innerHTML = parts.join("");

  const readSelections = () => [...screen.querySelectorAll('input[name="sel"]:checked')].map(i => i.value);

  /* keep the "counts as" hint, area badges and cross-link hints live */
  const refresh = () => {
    if (!hasChecklist) return;
    const sel = readSelections();
    const yes = n.options.find(o => o.value === "yes");
    const hint = $("#hint-counts", screen);
    if (sel.length && yes) {
      hint.hidden = false;
      hint.innerHTML = `${icon("arrowRight")}<span><b>${esc(t("question.countsAs", { n: sel.length }))}</b> ${esc(yes.label)}</span>`;
    } else {
      hint.hidden = true;
    }
    screen.querySelectorAll(".btn-opt").forEach(b => {
      b.dataset.suggested = String(!!(sel.length && yes && b.dataset.value === "yes"));
    });
    screen.querySelectorAll("details.area").forEach(d => {
      const boxes = [...d.querySelectorAll('input[name="sel"]')];
      const c = boxes.filter(b => b.checked).length;
      d.classList.toggle("has-sel", c > 0);
      const badge = d.querySelector(".count");
      if (badge) { badge.textContent = t("question.selectedCount", { n: c }); badge.hidden = c === 0; }
    });
    /* reminders that depend on what is ticked right now */
    const items = E.selectedItems(n, sel);
    const live = [];
    if (items.some(i => (i.impliesTransparency || []).includes("50-3") || i.crossLink === "biometrics-emotion-prohibition-reminder")) {
      live.push("biometrics-emotion-prohibition-reminder");
    }
    if (n.setsFlag === "transparency" && sel.includes("50-4") && !sel.includes("50-2")) live.push("deepfake-implies-synthetic");
    $("#hint-crosslinks", screen).innerHTML = live.map(id => reminderPanel(id)).join("");
  };
  screen.querySelectorAll('input[name="sel"]').forEach(el => el.addEventListener("change", refresh));
  refresh();

  screen.querySelectorAll(".btn-opt").forEach(b => {
    b.onclick = () => { E.submit({ value: b.dataset.value, selections: readSelections() }); paint({ focus: true }); };
  });
  const back = $("#btn-back", screen);
  if (back) back.onclick = () => { E.back(); paint({ focus: true }); };
}

function renderScreen() {
  const n = E.currentNode();
  if (n.type === "result" || E.state.finished) return renderResult();
  if (n.type === "context") return renderContext(n);
  return renderQuestion(n);
}

/* ---------- result ---------- */
/* A bare date reads as "Applies from 2 December 2027."; a phrase like
   "originally …, postponed to …" is printed as its own sentence instead. */
function applicationDate(card) {
  const key = (PRES[card.tier] || {}).appliesFrom;
  if (!key) return null;
  const raw = (TREE.meta.keyDates || {})[key];
  if (!raw) return null;
  return { text: niceDate(raw), bare: isBareDate(raw) };
}
function applicationDateLine(card) {
  const d = applicationDate(card);
  if (!d) return "";
  const body = d.bare
    ? `<b>${esc(t("result.applicationDate"))}</b> ${esc(d.text)}.`
    : `${esc(sentenceCase(d.text))}.`;
  return `<p class="dates">${icon("calendar")}<span>${body} ${esc(t("result.applicationDateNote"))}</span></p>`;
}

function resultCard(card, triggered) {
  const kicker = card.role === "primary" ? t("result.kicker.primary")
    : (card.tier === "transparency" ? t("result.kicker.transparency") : t("result.kicker.gpai"));
  const groups = E.groupObligations(card, { allRoles: showAllRoles });
  /* always label the group: with a role filter active there may be only one, and the
     reader still needs to know whose duties they are looking at */
  const showGroupHeadings = true;
  const g = guidanceBlock(card.guidelineLinks);

  const trig = card.id === "TRANSPARENCY" && triggered.length
    ? `<div class="triggered"><b>${esc(t("result.triggered"))}</b><ul>${triggered.map(item => `
        <li><span class="chip art">${esc(item.ref)}</span> ${esc(item.plain || item.label)}
        ${item.auto ? ` <span class="chip auto">${esc(t("question.autoDerived"))}</span>` : ""}
        <br><span style="color:var(--text-muted)">${esc(item.obligation || "")}</span></li>`).join("")}</ul></div>`
    : "";

  return `<article class="rcard" data-tier="${esc(card.color || "grey")}" style="${toneStyle(card.color)}">
    <div class="top">
      <span class="badge">${icon(E.pres(card).icon)}</span>
      <div>
        <div class="kicker">${esc(kicker)}</div>
        <h2>${esc(card.title)}</h2>
      </div>
    </div>
    <div class="body">
      <p class="summary">${esc(card.summary)}</p>
      ${trig}
      ${groups.length ? `<div>
        <h3 class="lbl">${esc(t("result.obligationsLabel"))}</h3>
        ${groups.map(gr => `<div class="role-group">
          ${showGroupHeadings ? `<h4>${icon(gr.role === "deployer" ? "people" : (gr.role === "provider" ? "build" : "info"))}${esc(t(`result.roleGroup.${gr.role}`))}</h4>` : ""}
          <ul class="obligations">${gr.items.map(o => `<li>${esc(o.text)}</li>`).join("")}</ul>
        </div>`).join("")}
      </div>` : ""}
      ${E.notesFor(card).map(k => notePanel(k)).join("")}
      ${applicationDateLine(card)}
      ${g.links}
      ${(card.legalRefs || []).length ? `<div class="refs">${card.legalRefs.map(r => `<span class="chip art">${esc(r)}</span>`).join("")}</div>` : ""}
    </div>
  </article>`;
}

function timelineItem(a) {
  return `<li>
    <div class="rail"><div class="dot"></div><div class="line"></div></div>
    <div class="content">
      <div class="q">${esc(a.question)}</div>
      <div class="a"><span class="arrow">→</span><span><b>${esc(a.answerLabel)}</b></span></div>
      ${a.selections && a.selections.length ? `<ul class="sel">${a.selections.map(s =>
        `<li>${esc(s.ref)} — ${esc(s.plain || s.label)}${s.auto ? ` (${esc(t("question.autoDerived"))})` : ""}</li>`).join("")}</ul>` : ""}
      <div class="meta">
        ${a.articleRef ? `<span class="chip art">${esc(a.articleRef)}</span>` : ""}
        ${a.uncertain ? `<span class="uncertain-tag">${esc(t("result.flagged"))}</span>` : ""}
        <button class="btn small ghost no-print" data-edit="${esc(a.nodeId)}">${esc(t("result.editAnswer"))}</button>
      </div>
    </div>
  </li>`;
}

      <div class="card" style="padding:16px 18px">
        <ol style="display:grid; gap:8px; font-size:.94rem">
          ${(t("result.nextSteps") || []).map(s => `<li>${esc(s)}</li>`).join("")}
        </ol>
        <h3 class="lbl" style="margin-top:18px">${esc(t("result.linksLabel"))}</h3>
        <ul class="link-list">
          <li><a href="https://digital-strategy.ec.europa.eu/en/policies/ai-act-service-desk" target="_blank" rel="noopener noreferrer">AI Act Service Desk / Single Information Platform${icon("external")}</a></li>
          ${Object.values(TREE.guidelines || {}).filter(g => g && g.url).map(g =>
            `<li><a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">${esc(g.title)}${icon("external")}</a></li>`).join("")}
        </ul>
      </div>
    </div>

    <div class="disclaimer"><strong>${esc(t("start.disclaimerLabel"))}</strong>${esc(m.disclaimer)}</div>
    <p style="font-size:.85rem; color:var(--text-muted)">${esc(t("result.draftNote", { version: m.version, date: m.lastUpdated, regulation: m.regulation }))}</p>
  </div>`;

  const sec = $("#result");
  sec.innerHTML = html;
  sec.hidden = false;
  $("#app").hidden = true;
  $("#start").hidden = true;
  $("#btn-restart").hidden = false;

  $("#btn-print").onclick = () => window.print();
  $("#btn-download").onclick = () => downloadSummary(heading, cards, triggered);
  $("#btn-back-result").onclick = () => { E.back(); paint({ focus: true }); };
  $("#btn-restart-2").onclick = restart;
  const roles = $("#btn-roles");
  if (roles) roles.onclick = () => { showAllRoles = !showAllRoles; renderResult(); };
  $("#map-toggle").addEventListener("toggle", (e) => {
    if (e.target.open && !$("#map-holder").innerHTML) $("#map-holder").innerHTML = mapPanel({ highlight: true });
  });
  $("#result-h").focus();
}

/* ---------- decision map ----------------------------------------------------
   Drawn at runtime from E.mapGraph(), so it always matches the JSON that is loaded
   (including a translated one) and can highlight the path the user actually took.
   render-decision-tree.py produces the same picture as a static file for the repo;
   the layout rules are deliberately identical. */
const MAP = {
  pad: 22, gutter: 44, colW: 320, gap: 86, boxMinH: 40,
  titleH: 15, subH: 12.5, vGap: 36, wrapTitle: 42, wrapSub: 48,
  bandHead: 22, bandFoot: 8   // headroom so the phase label is not behind a box
};

function wrapText(text, width) {
  const words = String(text == null ? "" : text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  for (const w of words) {
    if (!line.length) line = w;
    else if ((line + " " + w).length <= width) line += " " + w;
    else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines.length ? lines : [""];
}

/* palette: CSS variables when drawn in the page (so it follows the theme), resolved
   hex when exported to a standalone file where those variables do not exist */
function mapPalette(resolve) {
  const css = getComputedStyle(document.documentElement);
  const pick = (name, fallback) => {
    if (!resolve) return `var(${name})`;
    const v = css.getPropertyValue(name).trim();
    return v || fallback;
  };
  return {
    ink: pick("--text", "#14181f"),
    muted: pick("--text-muted", "#5b6472"),
    rule: pick("--border", "#dce0e6"),
    accent: pick("--accent", "#1d4ed8"),
    surface: pick("--surface", "#ffffff"),
    band: pick("--surface-2", "#f1f3f6"),
    bg: pick("--bg", "#ffffff"),
    tier: (c) => pick(`--tier-${c || "grey"}-accent`, "#44474D"),
    tierBg: (c) => pick(`--tier-${c || "grey"}-bg`, "#EFF1F4")
  };
}

function decisionMapSVG({ highlight = true, resolveColors = false } = {}) {
  const g = E.mapGraph();
  const path = highlight ? E.pathTaken() : { nodes: new Set(), edges: new Set() };
  const P = mapPalette(resolveColors);
  const M = MAP;
  const X0 = M.pad + M.gutter;
  const X1 = X0 + M.colW + M.gap;
  const outW = M.colW - 40;

  /* measure and place */
  const box = {};
  let y = M.pad + M.bandHead;
  for (const n of g.nodes.filter(n => n.col === 0).sort((a, b) => a.row - b.row)) {
    const title = wrapText(n.title, M.wrapTitle);
    const sub = n.sub ? wrapText(n.sub, M.wrapSub) : [];
    const h = Math.max(M.boxMinH, 30 + title.length * M.titleH + sub.length * M.subH);
    box[n.key] = { x: X0, y, w: M.colW, h, title, sub, node: n };
    y += h + M.vGap;
  }
  for (const n of g.nodes.filter(n => n.col === 1).sort((a, b) => a.row - b.row)) {
    const title = wrapText(n.title, 34);
    const sub = n.sub ? wrapText(n.sub, 40) : [];
    const h = Math.max(34, 24 + title.length * M.titleH + sub.length * M.subH);
    const sources = g.edges.filter(e => e.dst === n.key && box[e.src]).map(e => box[e.src].y);
    let top = sources.length ? Math.min(...sources) : M.pad + 6;
    while (Object.values(box).some(b => b.x === X1 && Math.abs(b.y - top) < h + 14)) top += h + 16;
    box[n.key] = { x: X1, y: top, w: outW, h, title, sub, node: n, outcome: true };
  }

  const width = X1 + outW + M.pad;
  const height = Math.max(...Object.values(box).map(b => b.y + b.h)) + 58;
  const out = [];

  /* phase bands */
  g.phases.forEach((phase, i) => {
    const members = (phase.nodes || []).map(k => box[k]).filter(Boolean);
    if (!members.length) return;
    const top = Math.min(...members.map(b => b.y)) - M.bandHead;
    const bot = Math.max(...members.map(b => b.y + b.h)) + M.bandFoot;
    out.push(`<rect x="${X0 - 12}" y="${top}" width="${M.colW + 24}" height="${bot - top}" rx="12"
      fill="${P.band}" stroke="${P.rule}" stroke-dasharray="3 3" opacity="${i % 2 ? "1" : ".55"}"/>`);
    out.push(`<text x="${X0 - 4}" y="${top + 14}" font-size="10" font-weight="700" fill="${P.muted}"
      letter-spacing=".06em">${esc(String(phase.label || "").toUpperCase())}</text>`);
  });

  /* arrows: merge parallel answers, route around skipped rows, label with a halo */
  const order = g.nodes.filter(n => n.col === 0).sort((a, b) => a.row - b.row).map(n => n.key);
  const rowIndex = {};
  order.forEach((k, i) => { rowIndex[k] = i; });
  const mergeClass = (style) => (style === "answer" || style === "unsure" ? "answer" : style);

  const merged = new Map();
  for (const e of g.edges) {
    const key = `${e.src}|${e.dst}|${mergeClass(e.style)}`;
    const slot = merged.get(key) || { src: e.src, dst: e.dst, cls: mergeClass(e.style), labels: [], styles: new Set(), on: false };
    if (!slot.labels.includes(e.short)) slot.labels.push(e.short);
    slot.styles.add(e.style);
    slot.on = slot.on || path.edges.has(`${e.src}>${e.dst}`);
    merged.set(key, slot);
  }

  for (const s of merged.values()) {
    const a = box[s.src], b = box[s.dst];
    if (!a || !b) continue;
    const isFlowPair = a.x === b.x;
    const skips = isFlowPair && Math.abs((rowIndex[s.dst] ?? 0) - (rowIndex[s.src] ?? 0)) > 1;
    const stroke = s.on ? P.accent : (s.cls === "answer" ? P.muted : P.accent);
    const dash = s.cls === "crosslink" ? "1 5" : s.cls === "engine" ? "2 4"
      : (s.styles.has("answer") ? "none" : "5 4");
    const w = s.on ? 2.6 : 1.5;
    let d, lx, ly, anchor;

    if (skips) {
      const ya = a.y + a.h / 2, yb = b.y + b.h / 2;
      const bulge = X0 - M.gutter + (s.cls === "crosslink" ? 2 : 20);
      d = `M ${a.x} ${ya} C ${bulge} ${ya}, ${bulge} ${yb}, ${b.x} ${yb}`;
      lx = X0 - M.gutter + (s.cls === "crosslink" ? 3 : 22);
      ly = (ya + yb) / 2 + (s.cls === "crosslink" ? 11 : 0);
      anchor = "start";
    } else if (isFlowPair) {
      const x = a.x + a.w / 2;
      d = `M ${x} ${a.y + a.h} L ${x} ${b.y}`;
      lx = x + 8; ly = (a.y + a.h + b.y) / 2 + 3; anchor = "start";
    } else if (b.x > a.x) {
      const y1 = a.y + a.h / 2, y2 = b.y + b.h / 2, mx = (a.x + a.w + b.x) / 2;
      d = `M ${a.x + a.w} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${b.x} ${y2}`;
      lx = b.x - 7; ly = y2 - 6; anchor = "end";
    } else {
      const y1 = a.y + a.h / 2, y2 = b.y + b.h / 2, mx = (a.x + b.x + b.w) / 2;
      d = `M ${a.x} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${b.x + b.w} ${y2}`;
      lx = mx; ly = (y1 + y2) / 2 - 6; anchor = "middle";
    }
    out.push(`<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-dasharray="${dash}"
      marker-end="url(#mk-${s.on ? "on" : s.cls === "answer" ? "plain" : "eng"})"/>`);
    let label = s.labels.join(" / ");
    if (label.length > 38) label = label.slice(0, 36) + "…";
    out.push(`<text x="${lx}" y="${ly}" font-size="10" fill="${s.on ? P.accent : P.muted}" text-anchor="${anchor}"
      stroke="${P.bg}" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">${esc(label)}</text>`);
  }

  /* boxes */
  for (const [key, b] of Object.entries(box)) {
    const n = b.node;
    const on = path.nodes.has(key);
    if (b.outcome) {
      const ink = P.tier(n.color), fill = P.tierBg(n.color);
      out.push(`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="9" fill="${fill}"
        stroke="${ink}" stroke-width="${on ? 3 : 1.6}" ${on ? "" : 'opacity=".85"'}/>`);
      let ty = b.y + 18;
      for (const line of b.title) {
        out.push(`<text x="${b.x + 11}" y="${ty}" font-size="11.5" font-weight="700" fill="${ink}">${esc(line)}</text>`);
        ty += M.titleH;
      }
      for (const line of b.sub) {
        out.push(`<text x="${b.x + 11}" y="${ty}" font-size="9.5" fill="${P.muted}">${esc(line)}</text>`);
        ty += M.subH;
      }
      continue;
    }
    const dash = n.kind === "context" ? ' stroke-dasharray="6 4"' : "";
    out.push(`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="9" fill="${P.surface}"
      stroke="${on ? P.accent : P.ink}" stroke-width="${on ? 2.6 : 1.5}"${dash}/>`);
    out.push(`<text x="${b.x + 11}" y="${b.y + 16}" font-size="9.5" font-weight="700" fill="${P.accent}"
      letter-spacing=".05em">${esc(key)}</text>`);
    let ty = b.y + 32;
    for (const line of b.title) {
      out.push(`<text x="${b.x + 11}" y="${ty}" font-size="11.5" fill="${P.ink}">${esc(line)}</text>`);
      ty += M.titleH;
    }
    for (const line of b.sub) {
      out.push(`<text x="${b.x + 11}" y="${ty}" font-size="9.5" fill="${P.muted}">${esc(line)}</text>`);
      ty += M.subH;
    }
  }

  /* legend */
  const legend = [
    ["answer", t("map.legend.answer")],
    ["unsure", t("map.legend.unsure")],
    ["engine", t("map.legend.engine")],
    ["crosslink", t("map.legend.crosslink")]
  ];
  let lx = M.pad, ly = height - 26;
  for (const [cls, text] of legend) {
    const dash = cls === "crosslink" ? "1 5" : cls === "engine" ? "2 4" : cls === "unsure" ? "5 4" : "none";
    const stroke = cls === "answer" || cls === "unsure" ? P.muted : P.accent;
    out.push(`<path d="M ${lx} ${ly} l 24 0" stroke="${stroke}" stroke-width="1.6" stroke-dasharray="${dash}"/>`);
    out.push(`<text x="${lx + 30}" y="${ly + 4}" font-size="10" fill="${P.muted}">${esc(text)}</text>`);
    lx += 40 + text.length * 5.4;
    if (lx > width - 200) { lx = M.pad; ly += 16; }
  }

  const defs = `<defs>
    <marker id="mk-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${P.muted}"/></marker>
    <marker id="mk-eng" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${P.accent}"/></marker>
    <marker id="mk-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${P.accent}"/></marker>
  </defs>`;

  return `<svg class="map" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img"
    xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    aria-label="${esc(t("result.mapAria"))}">${defs}<rect width="${width}" height="${height}" fill="${P.bg}"/>${out.join("")}</svg>`;
}

/* the map panel: the drawing, a caption and a download */
function mapPanel({ highlight }) {
  return `${decisionMapSVG({ highlight })}
    <div class="actions no-print" style="margin-top:10px">
      <button class="btn small" data-download-map="${highlight ? "path" : "plain"}">${esc(t("map.download"))}</button>
    </div>
    <p style="font-size:.85rem;color:var(--text-muted);margin-top:8px">${esc(t("result.mapCaption"))}</p>`;
}

function downloadMapSVG(highlight) {
  const svg = decisionMapSVG({ highlight, resolveColors: true });
  const blob = new Blob([`<?xml version="1.0" encoding="UTF-8"?>\n${svg}`], { type: "image/svg+xml;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${t("export.filename")}-decision-tree-${new Date().toISOString().slice(0, 10)}.svg`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

document.addEventListener("click", (ev) => {
  const btn = ev.target.closest("[data-download-map]");
  if (btn) downloadMapSVG(btn.dataset.downloadMap === "path");
});

/* ---------- markdown export ---------- */
function downloadSummary(heading, cards, triggered) {
  const m = TREE.meta, st = E.state, L = [];
  L.push(`# ${t("export.title", { title: m.title })}`, "");
  L.push(`**${t("export.outcome")}:** ${heading}`, "");
  L.push(`- ${t("export.toolVersion")}: ${m.version} (${m.lastUpdated})`);
  L.push(`- ${t("export.regulation")}: ${m.regulation}`);
  L.push(`- ${t("export.generated")}: ${new Date().toISOString().slice(0, 16).replace("T", " ")} (${t("export.generatedNote")})`);
  L.push(`- ${t("export.context")}: ${t("export.role")} = ${st.flags.role}; ${t("export.foss")} = ${st.flags.fossLicence}`, "");
  L.push(`## ${t("export.cardsTitle")}`, "");
  for (const c of cards) {
    L.push(`### ${c.title}`, "", c.summary, "");
    if (c.id === "TRANSPARENCY" && triggered.length) {
      L.push(`**${t("result.triggered")}**`, "");
      triggered.forEach(i => L.push(`- ${i.ref} — ${i.plain || i.label}${i.auto ? ` (${t("export.autoDerived")})` : ""} → ${i.obligation || ""}`));
      L.push("");
    }
    const groups = E.groupObligations(c, { allRoles: true });
    if (groups.length) {
      L.push(`**${t("result.obligationsLabel")}**`, "");
      groups.forEach(gr => {
        L.push(`- ${t(`result.roleGroup.${gr.role}`)}:`);
        gr.items.forEach(o => L.push(`  - ${o.text}`));
      });
      L.push("");
    }
    for (const key of E.notesFor(c)) {
      const nt = (TREE.notes || {})[key];
      if (nt) L.push(`> **${nt.title}** (${nt.articleRef || ""}) ${nt.body}`, "");
    }
    const date = applicationDate(c);
    if (date) L.push(date.bare
      ? `**${t("result.applicationDate")}** ${date.text}. ${t("result.applicationDateNote")}`
      : `**${t("result.applicationDate")}:** ${sentenceCase(date.text)}. ${t("result.applicationDateNote")}`, "");
    if ((c.legalRefs || []).length) L.push(`**${t("export.legalRefs")}:** ${c.legalRefs.join(", ")}`, "");
    const gl = (c.guidelineLinks || []).map(k => (TREE.guidelines || {})[k]).filter(Boolean);
    if (gl.length) L.push(`**${t("export.guidance")}:** ${gl.map(g => `${g.title} — ${g.url}`).join("; ")}`, "");
  }
  if (st.flags.reviewFlags.length) {
    L.push(`## ${t("export.reviewTitle")}`, "");
    st.flags.reviewFlags.forEach(r => L.push(`- **${r.question}** (${r.articleRef}) — ${r.note}`));
    L.push("");
  }
  L.push(`## ${t("export.trailTitle")}`, "");
  st.answers.forEach((a, i) => {
    L.push(`${i + 1}. **${a.question}** ${a.articleRef ? `(${a.articleRef})` : ""}`);
    L.push(`   - ${t("export.answer")}: ${a.answerLabel}`);
    (a.selections || []).forEach(s => L.push(`   - ${t("export.selected")}: ${s.ref} — ${s.plain || s.label}${s.auto ? ` (${t("export.autoDerived")})` : ""}`));
    if (a.uncertain) L.push(`   - ${t("export.flagged")}`);
  });
  L.push("", `## ${t("export.disclaimerTitle")}`, "", m.disclaimer, "");
  L.push(`## ${t("export.sourcesTitle")}`, "");
  Object.values(TREE.guidelines || {}).filter(g => g && g.url).forEach(g => L.push(`- ${g.title} (${g.status}) — ${g.url}`));

  const blob = new Blob([L.join("\n")], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${t("export.filename")}-${new Date().toISOString().slice(0, 10)}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- orchestration ---------- */
function paint({ focus = false } = {}) {
  if (E.state.finished) { renderResult(); return; }
  $("#start").hidden = true;
  $("#result").hidden = true;
  $("#app").hidden = false;
  $("#btn-restart").hidden = false;
  renderStepper();
  renderVerdict();
  renderScreen();
  if (focus) { const h = $("#q-text"); if (h) h.focus(); }
}

function restart() {
  E.reset();
  prevVerdictLen = 0;
  showAllRoles = false;
  $("#result").hidden = true;
  $("#app").hidden = true;
  $("#btn-restart").hidden = true;
  $("#start").hidden = false;
  window.scrollTo({ top: 0, behavior: "auto" });
  $("#btn-start").focus();
}

document.addEventListener("click", (ev) => {
  const btn = ev.target.closest("[data-edit]");
  if (!btn || !E) return;
  E.editFrom(btn.dataset.edit);
  paint({ focus: true });
});

/* printing: expand every disclosure so nothing is silently missing from the PDF */
let reopenAfterPrint = [];
window.addEventListener("beforeprint", () => {
  reopenAfterPrint = [...document.querySelectorAll("details:not([open])")];
  reopenAfterPrint.forEach(d => { d.open = true; });
});
window.addEventListener("afterprint", () => {
  reopenAfterPrint.forEach(d => { d.open = false; });
  reopenAfterPrint = [];
});

(async function init() {
  const data = await loadData();
  TREE = data.tree;
  PRES = data.presentation;
  PHASES = data.phases;
  UI = data.ui;

  const own = validateTree(TREE, PRES);
  E = createEngine(TREE, { ui: UI, presentation: PRES, phases: PHASES });
  if (own.length) { showDataErrors(t("error.contract"), own); return; }
  if (data.errors && data.errors.length) showDataErrors(t("error.externalIgnored"), data.errors);

  renderStart(data);
  $("#btn-start").onclick = () => paint({ focus: true });
  $("#btn-restart").onclick = restart;

  /* exposed for test-scenarios.mjs and console debugging */
  window.AIAct = {
    get tree() { return TREE; }, get engine() { return E; }, get ui() { return UI; },
    createEngine, validateTree
  };
})();
</script>
</body>
